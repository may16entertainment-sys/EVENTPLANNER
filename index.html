<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Build-Up Site Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: site-office board — drawing sheet in the middle, tool rail left, schedule/brief panel right, day scrubber under the sheet */
:root{
  --bg:#eef0ec; --sheet:#fbfcf9; --panel:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#d3d8d2; --line2:#e4e8e3;
  --accent:#e8590c; --accent-ink:#ffffff; --snap:#0b7285; --hazard:#f2a516; --hazard2:#1d2420;
  --ok:#2f8f4e; --warn:#c77c02; --bad:#c92a2a; --info:#3b6fb6;
  --grid:#dfe4de; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.08);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a17; --sheet:#1b211e; --panel:#1f2622; --fg:#e6ebe7; --muted:#9aa69f; --line:#34403a; --line2:#2a332e;
  --accent:#ff7a2e; --accent-ink:#1a1008; --snap:#3bc9db; --hazard:#e6a019; --hazard2:#151a17;
  --ok:#55c27a; --warn:#e6a019; --bad:#ff6b6b; --info:#7aa7ea; --grid:#28312c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a17; --sheet:#1b211e; --panel:#1f2622; --fg:#e6ebe7; --muted:#9aa69f; --line:#34403a; --line2:#2a332e;
  --accent:#ff7a2e; --accent-ink:#1a1008; --snap:#3bc9db; --hazard:#e6a019; --hazard2:#151a17;
  --ok:#55c27a; --warn:#e6a019; --bad:#ff6b6b; --info:#7aa7ea; --grid:#28312c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.top .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.evpick{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.choice b{font-weight:600}
.gate{position:fixed;inset:0;z-index:15;background:var(--bg);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.gate .gcard{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.gate h2{margin:0;font-family:var(--f-display);font-size:28px}
.gate p{margin:0;color:var(--muted)}
.gate .gbrand{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gate .gform{display:flex;flex-direction:column;gap:8px}
.gate .gerr{color:var(--bad)}
body.gated .app{visibility:hidden}
.access{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.danger-zone{border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.on{border-color:var(--snap);color:var(--snap)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-width:0}
.pill{font-family:var(--f-mono);font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}
.main{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(320px,400px);gap:12px;min-height:0}
.rail{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow-y:auto;width:180px}
.rail h3{margin:6px 4px 2px;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.railadd{font-family:var(--f-body);font-size:11.5px;letter-spacing:0;text-transform:none;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:5px;padding:1px 7px;white-space:nowrap;flex:none}
.railadd:hover{border-color:var(--accent)}
.toolrow{display:flex;align-items:center;gap:2px}
.toolrow .tool{flex:1;min-width:0}
.tooledit{flex:none;border:none;background:none;color:var(--muted);border-radius:5px;width:26px;height:26px;display:grid;place-items:center;opacity:0}
.toolrow:hover .tooledit,.tooledit:focus-visible{opacity:1}
.tooledit:hover{background:var(--line2);color:var(--fg)}
@media (hover:none){.tooledit{opacity:.7}}
.tool small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.sheet.editing [data-zone]{cursor:move!important}
.viewbar{position:absolute;top:8px;left:8px;right:56px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.viewbar>*{pointer-events:auto}
.viewbar .btn{background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.viewbar .pill.hid{font-size:10.5px;padding:0 6px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:2px;font-size:12px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));border:1px solid var(--accent);border-radius:999px;padding:1px 2px 1px 10px}
.showpanel{position:absolute;top:44px;left:8px;width:min(320px,calc(100% - 70px));max-height:calc(100% - 60px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;z-index:5;display:flex;flex-direction:column;gap:10px;font-size:13px}
.showpanel .sp-h{display:flex;justify-content:space-between;align-items:center}
.showpanel .sp-sec{display:flex;flex-direction:column;gap:3px}
.showpanel .sp-t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.showpanel label{display:flex;align-items:center;gap:7px}
.shprev{border:1px solid var(--line);border-radius:8px;min-height:120px;display:grid;place-items:center;overflow:hidden;background:#fff}
.shprev img{display:block;width:100%;height:auto}
.daterow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px}
.daterow label{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.daterow input{padding:4px 6px;font-family:var(--f-mono);font-size:12.5px}
.dstate{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.mtog{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.fillctl{display:inline-flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);white-space:nowrap}
.fillctl input{width:110px;accent-color:var(--accent)}
.opctl{display:flex;align-items:center;gap:8px}
.opctl input{flex:1;accent-color:var(--accent)}
.tool{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:6px;padding:5px 6px;text-align:left;font-size:13px}
.tool:hover{background:var(--line2)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tool svg{flex:none}
.sheetwrap{display:flex;flex-direction:column;min-height:0;min-width:0;gap:8px}
.sheet{position:relative;flex:1;min-height:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.sheet svg#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet.drawing svg#map{cursor:crosshair}
.mapbar{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-direction:column}
.mapbar .btn{padding:4px 8px;justify-content:center;min-width:32px}
.hint{position:absolute;left:8px;bottom:8px;right:60px;font-size:12.5px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:6px;padding:5px 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.banner{position:absolute;top:44px;left:8px;right:56px;font-size:12.5px;background:var(--panel);border:1px solid var(--warn);border-radius:6px;padding:6px 10px}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;pointer-events:none}
.empty .box{pointer-events:auto;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--f-display);margin:0 0 6px;font-size:24px}
.scrub{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.scrub .day{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1;min-width:150px}
.scrub .day small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.scrub input[type=range]{width:100%;accent-color:var(--accent)}
.ticks{grid-column:2;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:10px 12px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:var(--sheet);border-radius:999px;padding:0 6px}
.pbody{overflow-y:auto;padding:12px;min-height:0;flex:1;display:flex;flex-direction:column;gap:12px}
.sec h4{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.meas{display:flex;gap:16px;flex-wrap:wrap}
.meas div{display:flex;flex-direction:column}
.meas b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.meas span{font-size:11px;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.gantt{overflow-x:auto;border:1px solid var(--line2);border-radius:8px}
.grow{display:grid;grid-template-columns:150px 1fr;min-width:420px;border-bottom:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.grow:hover{background:var(--line2)}
.grow.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.grow .gl{padding:5px 8px;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line2)}
.grow .gl b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gl span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{position:relative}
.gt .bar{position:absolute;top:8px;bottom:8px;border-radius:3px;min-width:6px}
.gt .bar.done{opacity:.45}
.gt .now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.gt .ev{position:absolute;top:0;bottom:0;border-left:2px dashed var(--bad)}
.ghead{display:grid;grid-template-columns:150px 1fr;min-width:420px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ghead .gt{display:flex}
.ghead .gt div{flex:1;padding:4px 0 4px 3px;border-left:1px solid var(--line2);white-space:nowrap;overflow:hidden}
.task{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.task .t1{display:flex;gap:8px;align-items:center}
.task .t1 input{flex:1}
.st{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.st.done{color:var(--ok)} .st.ready{color:var(--accent)} .st.wait{color:var(--muted)} .st.started{color:var(--info)}
.conf{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.conf.critical{border-left-color:var(--bad)} .conf.info{border-left-color:var(--info)}
.conf b{font-weight:600}
.brief{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--line2);border-radius:8px;padding:10px;overflow-x:auto}
.vrow{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;border:1px solid var(--line);border-radius:8px;padding:8px;align-items:center}
.vrow input[type=color]{width:28px;height:28px;border:none;background:none;padding:0}
.modal{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;border:1px solid var(--line);min-height:0}
.modal .mb{min-height:0}
.modal .mh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-family:var(--f-display);font-size:24px}
.modal .mh p{margin:2px 0 0;color:var(--muted);font-size:13px}
.modal .mb{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.q{display:flex;flex-direction:column;gap:6px}
.q > label.ql,.q > .ql{font-weight:600;font-size:13.5px}
.q .help{font-size:12px;color:var(--muted)}
.chks{display:flex;flex-direction:column;gap:2px;max-height:170px;overflow-y:auto;border:1px solid var(--line2);border-radius:6px;padding:6px}
.chks label{display:flex;gap:7px;align-items:center;font-size:13px;padding:2px}
.chks .grp{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.follow{display:grid;grid-template-columns:1fr 120px 64px auto;gap:6px;align-items:center}
.qed{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:6px;padding:6px}
.qed .kind{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--sheet);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.zl{font-family:var(--f-display);font-weight:600;font-size:15px;paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.zs{font-family:var(--f-mono);font-size:9.5px;paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.ml{font-family:var(--f-mono);font-size:11px;font-weight:500;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.main.norail{grid-template-columns:minmax(0,1fr) minmax(320px,400px)}
@media (max-width:1100px){.main{grid-template-columns:auto minmax(0,1fr)}.main.norail{grid-template-columns:minmax(0,1fr)}.panel{grid-column:1/-1}}
@media (max-width:720px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
  .rail h3{margin:0}.rail h3 .lbl{display:none}.tool,.toolrow{flex:none}
  .sheet{height:62svh;flex:none}
  .follow{grid-template-columns:1fr 1fr}
  .brand h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><small id="dates">Build-up board</small><h1 id="planName">Site board</h1></div>
    <div class="ctl">
      <span class="evpick" id="undoBox" hidden><button class="btn" id="btnUndo" type="button" title="Undo (Ctrl+Z)" disabled>↶ Undo</button><button class="btn" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" disabled>↷ Redo</button></span>
      <span class="save" id="saveState"></span>
      <span class="evpick" id="evPick"><label class="muted" for="eventSel" style="font-size:12px">Event</label>
      <select id="eventSel" class="sel" style="max-width:220px" data-list="event"></select>
      <button class="btn" id="btnNewEvent" type="button" hidden>+ New event</button></span>
      <label class="muted" for="viewAs" style="font-size:12px">Viewing as</label>
      <select id="viewAs" class="sel" data-list="vendor"></select>
      <span class="evpick" id="userBox" hidden><span class="save" id="userEmail"></span><button class="btn" id="btnSignOut" type="button">Sign out</button></span>
      <button class="btn" id="btnSettings" type="button">Event settings</button>
    </div>
  </header>
  <div class="main">
    <nav class="rail" id="rail" aria-label="Drawing tools"></nav>
    <div class="sheetwrap">
      <div class="sheet" id="sheet">
        <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" aria-label="Site map">
          <defs>
            <pattern id="hz" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)"><rect width="16" height="16" style="fill:var(--hazard2)" opacity=".85"/><rect width="8" height="16" style="fill:var(--hazard)"/></pattern>
            <pattern id="turfp" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M2 8 l1.5-4 M6 9 l1-3.5" style="stroke:var(--ok)" stroke-width="1" fill="none" opacity=".7"/></pattern>

// shrink a floor plan so it fits in one database document (under 1 MB)
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('That file isn’t an image this browser can read. Use PNG or JPG.'));im.src=url;});
    const W0=img.naturalWidth,H0=img.naturalHeight;let scale=Math.min(1,3200/Math.max(W0,H0)),q=0.85,out='';
    for(let i=0;i<10;i++){
      const c=document.createElement('canvas');c.width=Math.round(W0*scale);c.height=Math.round(H0*scale);
      const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',q);if(out.length<=950000)break;
      if(q>0.6)q-=0.1;else scale*=0.8;
    }
    if(out.length>950000)throw new Error('the floor plan is too detailed to store. Export it smaller.');
    return {data:out,w:W0,h:H0};
  }finally{URL.revokeObjectURL(url);}
}

const Store={mode:'loading',role:null,email:'',d:emptyPlan(),version:0,canEdit:false,dirty:false,saving:false,again:false,lockedVendor:null,lastSaved:null,problem:'',
  events:[],eventId:null,views:{},accessSig:{},bgCache:{},unsub:null,previewing:null,previewBackup:null,signin:{},
  async init(){
    const qs=new URLSearchParams(location.search);const wanted=qs.get('event');
    if(!cloudConfigured()||location.protocol==='file:'){this.initLocal(wanted);setSave();return;}
    this.mode='cloud';
    try{firebase.initializeApp(CONFIG.firebase);}catch(e){}
    Cloud.auth=firebase.auth();Cloud.db=firebase.firestore();
    // returning from a sign-in email
    if(Cloud.auth.isSignInWithEmailLink(location.href)){
      const email=ls.get('siteboard.signinEmail');
      if(email){try{await Cloud.auth.signInWithEmailLink(email,location.href);ls.del('siteboard.signinEmail');}catch(e){this.signin.error=authMessage(e);}this.cleanLink();}
      else this.signin.pendingLink=location.href; // opened on another device: ask them to confirm their email
    }
    await new Promise(res=>{const un=Cloud.auth.onAuthStateChanged(()=>{un();res();});});
    await this.afterAuth(wanted);
    // signing in or out in another tab reloads this one
    Cloud.auth.onAuthStateChanged(u=>{if((u?.email||'').toLowerCase()!==this.email)location.reload();});
    setSave();
  },
  cleanLink(){try{const u=new URL(location.href);['apiKey','oobCode','mode','lang','continueUrl','tenantId'].forEach(k=>u.searchParams.delete(k));history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(e){}},
  initLocal(wanted){
    this.mode='local';this.role='planner';
    let evs=null;try{evs=JSON.parse(ls.get('siteboard.events')||'null');}catch(e){}
    if(!Array.isArray(evs)||!evs.length){
      let saved=null;try{saved=JSON.parse(ls.get('siteboard.v2')||'null');}catch(e){}
      const d=normalize(saved&&saved.zones?saved:makeSample());ls.set('siteboard.v2',JSON.stringify(d));
      evs=[evEntry('plan',d)];ls.set('siteboard.events',JSON.stringify(evs));
    }
    this.events=evs;this.eventId=this.pickEvent(wanted);this.loadLocal();this.canEdit=true;
    if(this.eventId)setUrlEvent(this.eventId);
  },
  pickEvent(wanted){
    const has=id=>id&&this.events.some(e=>e.id===id);
    if(has(wanted))return wanted;
    const last=ls.get('siteboard.lastEvent');if(has(last))return last;
    return this.events[0]?.id||null;
  },
  async afterAuth(wanted){
    const u=Cloud.auth.currentUser;this.email=(u?.email||'').toLowerCase();
    if(!u){this.role='none';return;}
    if(await this.isPlanner()){
      this.role='planner';this.canEdit=true;
      try{await this.loadEvents();}catch(e){this.problem='Could not load events: '+authMessage(e);}
      const id=this.pickEvent(wanted);if(id)await this.openEvent(id);
    }else{

      let items=[];

function buildVendorView(vid){
  const T=TK(),zs=Z(),vend=V(),s=S();

  const mine=new Set(leaves.filter(i=>T[i].vendorId===vid));

  mine.forEach(i=>nbrTasks.delete(i));

  const named=v=>v===vid||(share&&nbrVendors.has(v));

      answers:ownZone?(z.answers||{}):{},vendorId:z.vendorId?(named(z.vendorId)?z.vendorId:'_other'):'',clearBy:drop?(z.clearBy||''):''};});

}

/* ============ schedule ============ */
/* A task can be a job with ordered steps (subtasks). Steps run one after another;
   a step marked "withPrev" runs alongside the step before it. A job spans its steps,
   and anything that waits for a job waits for all of its steps. */
let SCH={},CYC=new Set(),EDEPS={},KIDS={},STATE={},EARLY={};
function computeSchedule(){
  const T=TK();SCH={};CYC=new Set();EDEPS={};KIDS={};STATE={};EARLY={};const vis={};
  Object.entries(T).forEach(([id,t])=>{if(t.parentId&&T[t.parentId])(KIDS[t.parentId]=KIDS[t.parentId]||[]).push(id);});
  Object.values(KIDS).forEach(a=>a.sort((x,y)=>(T[x].order??0)-(T[y].order??0)));
  function go(id){
    if(SCH[id])return SCH[id];
    if(vis[id]){CYC.add(id);return {s:0,e:0};}
    vis[id]=1;const t=T[id];
    if(t.fixedS!=null){const r={s:t.fixedS,e:t.fixedE};SCH[id]=r;EDEPS[id]=[];return r;} // supplier copy: dates worked out by the planner
    const ks=KIDS[id];
    if(ks&&ks.length){ks.forEach(go);const r={s:Math.min(...ks.map(k=>SCH[k].s)),e:Math.max(...ks.map(k=>SCH[k].e))};SCH[id]=r;EDEPS[id]=(t.deps||[]).filter(d=>T[d]);return r;}
    let deps=[...(t.deps||[])],s=0,nb=offOf(t.notBefore),pin=offOf(t.start);
    const p=t.parentId&&T[t.parentId];
    if(p){const sib=KIDS[t.parentId];const i=sib.indexOf(id);
      if(i===0){deps.push(...(p.deps||[]));const pnb=offOf(p.notBefore);if(pnb!=null)nb=nb==null?pnb:Math.max(nb,pnb);if(pin==null&&p.start)pin=offOf(p.start);}
      else if(t.withPrev){const pr=sib[i-1];s=Math.max(s,go(pr).s);deps.push(...(EDEPS[pr]||[]));}
      else{let m=i-1;deps.push(sib[m]);while(m>0&&T[sib[m]].withPrev){m--;deps.push(sib[m]);}}
    }
    deps=[...new Set(deps.filter(d=>T[d]&&d!==id))];EDEPS[id]=deps;
    if(nb!=null)s=Math.max(s,nb);
    deps.forEach(d=>{s=Math.max(s,go(d).e);});
    // a start date you typed wins; if it's earlier than the work it waits for, Clashes says so
    if(pin!=null){EARLY[id]=s;s=pin;}
    const r={s,e:s+Math.max(0.5,Number(t.days)||1)};SCH[id]=r;return r;

}

function pxUnits(px){const r=$('#map').getBoundingClientRect();return px*ui.vb.w/(r.width||1000);}

function snapPoint(raw,ctx){

  if(!ui.snap||ui.shift)return res;
  const tol=pxUnits(CONFIG.snapPixels);
  const verts=[];const segsAll=[];
  Object.entries(Z()).forEach(([id,z])=>{
    piecesOf(z).forEach((pc,pi)=>{const skip=id===ctx.skipZone&&pi===(ctx.skipPiece||0);
      pc.forEach((p,i)=>{if(skip&&i===ctx.skipIdx)return;verts.push(p);});

  (ctx.more||[]).forEach(pc=>{pc.forEach(p=>verts.push(p));edgesOfPiece(pc,ctx.geom).forEach(e=>segsAll.push(e));});
  for(let i=1;i<(ctx.extra||[]).length;i++)segsAll.push([ctx.extra[i-1],ctx.extra[i]]);

  // 2. straight / 45° / square to previous segment

      if(ctx.prevPrev){const pa=Math.atan2(pv.y-ctx.prevPrev.y,pv.x-ctx.prevPrev.x)*180/Math.PI;for(let k=-2;k<=2;k++)bases.push(pa+k*90);}

/* ============ conflicts ============ */
function conflicts(){
  const out=[];const zs=Z(),T=TK();const zids=Object.keys(zs);
  CYC.forEach(id=>out.push({level:'critical',title:'Circular dependency',detail:`"${T[id]?.title}" ends up waiting on itself. Remove one of its "starts after" links.`,zones:[T[id]?.zoneId]}));
  Object.keys(EARLY).forEach(id=>{const t=T[id];if(!t||EARLY[id]<=SCH[id].s+1e-6)return;
    const holder=t.start?id:(t.parentId&&T[t.parentId]?.start?t.parentId:id);const ok=Math.ceil(EARLY[id]-1e-6);
    out.push({level:'critical',title:'Starts before the work it waits for is finished',detail:`${taskLabel(id)} (${vendorName(t.vendorId)}) is set to start ${fmtDay(SCH[id].s,false)}, but the work before it finishes ${fmtDay(EARLY[id])}.`,zones:[t.zoneId],
      fix:{label:`Start ${fmtDay(ok,false)} instead`,run:()=>{const c=clone(T[holder]);c.start=isoOf(ok);Store.put('tasks',holder,c);}},
      fix2:{label:'Start automatically',run:()=>{const c=clone(T[holder]);delete c.start;Store.put('tasks',holder,c);}}});});
  const ev=eventOff();
  Object.keys(T).filter(isLeaf).forEach(id=>{if(SCH[id]&&SCH[id].e>ev)out.push({level:'critical',title:'Finishes after event day',detail:`${taskLabel(id)} (${vendorName(T[id].vendorId)}) ends ${fmtDay(SCH[id].e)}, after the event on ${fmtDay(ev,false)}.`,zones:[T[id].zoneId]});});
  const seen=new Set();
  for(let i=0;i<zids.length;i++)for(let j=i;j<zids.length;j++){
    const a=zs[zids[i]],b=zs[zids[j]];if(i!==j&&!overlap(a,b))continue;
    const ta=zoneTasks(zids[i]),tb=zoneTasks(zids[j]);
    ta.forEach(x=>tb.forEach(y=>{
      if(x===y)return;const k=[x,y].sort().join('|');if(seen.has(k))return;seen.add(k);
      const X=T[x],Y=T[y];if(X.vendorId===Y.vendorId)return;
      if(X.parentId&&X.parentId===Y.parentId)return; // steps of one job: you set their order yourself
      if((a.parallel||[]).includes(Y.vendorId)||(b.parallel||[]).includes(X.vendorId))return;
      const sx=SCH[x],sy=SCH[y];
      if(sx.s<sy.e&&sy.s<sx.e){
        const first=sx.s<=sy.s?x:y,second=first===x?y:x;
        // make the later job (or task) wait for the earlier one
        const waiter=T[second].parentId&&T[T[second].parentId]?T[second].parentId:second;
        out.push({level:'critical',title:'Two vendors in the same area',detail:`${vendorName(X.vendorId)} (${taskLabel(x)}) and ${vendorName(Y.vendorId)} (${taskLabel(y)}) are both scheduled in ${a.label}${i!==j?' / '+b.label:''} on ${fmtDay(Math.max(sx.s,sy.s))}.`,zones:[zids[i],zids[j]],
          fix:{label:`${T[waiter].title} waits for ${taskLabel(first)}`,run:()=>{const t=clone(T[waiter]);t.deps=[...new Set([...(t.deps||[]),first])];Store.put('tasks',waiter,t);}},
          fix2:{label:'They can work in parallel',run:()=>{const zid=T[second].zoneId;const z=clone(zs[zid]);z.parallel=[...new Set([...(z.parallel||[]),T[first].vendorId])];Store.put('zones',zid,z);}}});
      }
    }));
  }
  zids.filter(id=>TYPES[zs[id].type]?.drop).forEach(id=>{
    const z=zs[id];const a=autoClearBy(id);const man=offOf(z.clearBy);
    if(a&&man!=null&&man>a.off)out.push({level:'critical',title:'Items still stored where work starts',detail:`${vendorName(z.vendorId)} may leave items in ${z.label} until ${fmtDay(man)}, but ${taskLabel(a.task)} (${vendorName(T[a.task].vendorId)}) starts there ${fmtDay(a.off)}.`,zones:[id,T[a.task].zoneId],fix:{label:`Clear by ${fmtDay(a.off)}`,run:()=>{const c=clone(z);c.clearBy=isoOf(a.off);Store.put('zones',id,c);}}});
    else if(a&&man==null)out.push({level:'info',title:'Drop-off deadline set automatically',detail:`${vendorName(z.vendorId)} must clear ${z.label} by ${fmtDay(a.off)} so ${taskLabel(a.task)} can start.`,zones:[id]});
  });
  zids.filter(id=>TYPES[zs[id].type]?.route).forEach(rid=>{
    zids.forEach(o=>{const oz=zs[o];if(o===rid)return;const r=oz.after||'none';if(!blocksVehicles(r))return;if(!overlap(zs[rid],oz))return;
      out.push({level:lookOf(oz.type)==='cable'?'critical':'warn',title:lookOf(oz.type)==='cable'?'Vehicle route crosses live cables':'Vehicle route crosses a restricted area',detail:`${zs[rid].label} crosses ${oz.label} (${restrictLabel(r).toLowerCase()} from ${fmtDay(restrictFrom(o))}). Reroute, add a cable ramp, or brief the drivers.`,zones:[rid,o]});});
  });
  const ord={critical:0,warn:1,info:2};return out.sort((a,b)=>ord[a.level]-ord[b.level]);
}

  type=type||'turf';

      else if(b.dataset.dn){sync();const i=+b.dataset.dn;[qs[i+1],qs[i]]=[qs[i],qs[i+1]];draw();}

  });

function addStep(id){
  const T=TK();const t=T[id];
  if(isParent(id)){const ks=KIDS[id];const last=T[ks[ks.length-1]];Store.put('tasks','t_'+uid(),{title:'New step',zoneId:t.zoneId,vendorId:'',days:1,deps:[],status:'todo',notBefore:'',parentId:id,order:(last?.order??ks.length-1)+1,withPrev:false});return;}
  // turn a single task into a job: its work becomes step 1
  Store.put('tasks','t_'+uid(),{title:t.title,zoneId:t.zoneId,vendorId:t.vendorId,days:t.days,deps:[],status:t.status||'todo',notBefore:'',parentId:id,order:0,withPrev:false});
  Store.put('tasks','t_'+uid(),{title:'Next step',zoneId:t.zoneId,vendorId:'',days:1,deps:[],status:'todo',notBefore:'',parentId:id,order:1,withPrev:false});
  const p=clone(t);p.title=Z()[t.zoneId]?.label?`${Z()[t.zoneId].label} works`:t.title;p.status='todo';Store.put('tasks',id,p);
}
function moveStep(id,dir){
  const pid=TK()[id].parentId;const ks=[...KIDS[pid]];const i=ks.indexOf(id),j=i+dir;if(j<0||j>=ks.length)return;
  [ks[i],ks[j]]=[ks[j],ks[i]];
  ks.forEach((k,n)=>{const t=TK()[k];if(t.order!==n||(n===0&&t.withPrev)){const c=clone(t);c.order=n;if(n===0)c.withPrev=false;Store.put('tasks',k,c);}});
}
function removeTask(id){
  const ids=new Set([id,...(KIDS[id]||[])]);const own=TK()[id].deps||[];
  Object.entries(TK()).forEach(([o,t])=>{if(ids.has(o))return;if((t.deps||[]).some(d=>ids.has(d))){const c=clone(t);c.deps=[...new Set(c.deps.filter(d=>!ids.has(d)).concat(TK()[id].parentId?[]:own))].filter(d=>d!==o);Store.put('tasks',o,c);}});
  const gone=clone(TK()[id]);const pid=gone.parentId;
  ids.forEach(k=>Store.del('tasks',k));
  // a job left with no steps becomes a plain task again, using the removed step's vendor and days
  if(pid&&TK()[pid]&&!Object.values(TK()).some(t=>t.parentId===pid)){const p=clone(TK()[pid]);p.vendorId=gone.vendorId;p.days=gone.days;Store.put('tasks',pid,p);}
}

function briefText(vid){
  const T=TK(),zs=Z();const mine=vendorSteps(vid);
  const L=[];L.push(`${S().name||'Event'} — brief for ${vendorName(vid)}`);L.push(`Build-up ${fmtDay(0,false)} → event ${fmtDay(eventOff(),false)}`);
  if(Store.mode==='cloud')L.push(`Your live plan: ${siteUrl()} (sign in with ${V()[vid]?.email||'your registered email'})`);
  const linked=new Set();
  L.push('');L.push('YOUR WORK');
  if(!mine.length)L.push('- No installation work assigned.');
  mine.forEach(i=>{const t=T[i];const z=zs[t.zoneId];
    const w=t.waitsOn?t.waitsOn:(EDEPS[i]||[]).map(d=>{const dv=isParent(d)?null:T[d].vendorId;if(dv&&dv!==vid)linked.add(dv);if(isParent(d))KIDS[d].forEach(k=>{if(T[k].vendorId!==vid)linked.add(T[k].vendorId);});return `${taskLabel(d)} (${isParent(d)?'all steps':vendorName(dv)})`;});
    const nxt=t.nextUp?[]:successors(i);nxt.forEach(o=>{if(T[o].vendorId!==vid)linked.add(T[o].vendorId);});
    const nxtTxt=t.nextUp?t.nextUp:nxt.map(o=>`${vendorName(T[o].vendorId)} (${taskLabel(o)})`);
    const size=z&&mPer()&&!t.parentId?` (${z.geom==='poly'?fmtArea(areaOf(z)):fmtLen(lengthOf(z))}${(z.parts||[]).length?`, ${z.parts.length+1} pieces`:''})`:'';
    L.push(`- ${taskLabel(i)} at ${z?.label||'site'}${size}: ${fmtDay(SCH[i].s)} → ${fmtDay(SCH[i].e)} (${t.days} day${t.days==1?'':'s'}).`);
    if(t.withPrev)L.push('    Runs at the same time as the step before it.');
    if(w.length)L.push(`    Start only after: ${w.join('; ')}.`);
    if(nxtTxt.length)L.push(`    Finish on time: ${nxtTxt.join(', ')} starts right after you.`);});
  const drops=Object.keys(zs).filter(id=>TYPES[zs[id].type]?.drop&&zs[id].vendorId===vid);
  if(drops.length){L.push('');L.push('WHERE YOU CAN LEAVE ITEMS');drops.forEach(id=>{const c=clearByOff(id);L.push(`- ${zs[id].label}: ${c?`remove everything before ${fmtDay(c.off)}`:'no deadline yet'}${c&&c.task?` — ${taskLabel(c.task)} starts there`:''}.`);});L.push('- Do not leave items anywhere else.');}
  const rules=Object.keys(zs).filter(id=>zs[id].after&&zs[id].after!=='none');
  if(rules.length){L.push('');L.push('SITE RULES');rules.forEach(id=>L.push(`- ${zs[id].label}: ${restrictLabel(zs[id].after).toLowerCase()} from ${fmtDay(restrictFrom(id))}.`));}
  const locks=Object.keys(zs).map(id=>({id,w:zoneWindow(id)})).filter(x=>x.w&&zoneTasks(x.id).some(t=>T[t].vendorId!==vid));
  if(locks.length){L.push('');L.push('LOCKED WHILE OTHERS WORK (stay out)');locks.sort((a,b)=>a.w.s-b.w.s).forEach(({id})=>{const parts=zoneTasks(id).filter(t=>T[t].vendorId!==vid);const s=Math.min(...parts.map(t=>SCH[t].s)),e=Math.max(...parts.map(t=>SCH[t].e));const others=[...new Set(parts.map(t=>vendorName(T[t].vendorId)))];L.push(`- ${zs[id].label}: ${fmtDay(s)} → ${fmtDay(e)} (${others.join(', ')}).`);});}
  if(Store.d.view)Object.keys(V()).forEach(k=>{if(k!=='_other')linked.add(k);});
  linked.delete(vid);linked.delete('_other');linked.delete('');linked.delete(undefined);
  if(linked.size){L.push('');L.push('VENDORS BEFORE AND AFTER YOU');[...linked].forEach(o=>L.push('- '+contactLine(o)));}
  return L.join('\n');
}

/* ============ your own lists: item types, restrictions, statuses ============
   Everything here is stored in the plan, so it can be added to and edited from any dropdown. */
const DEFAULT_RESTRICTIONS=[
  {id:'no_vehicles',label:'No vehicles',short:'NO VEHICLES',blocksVehicles:true},
  {id:'no_walking',label:'Keep off: no foot traffic',short:'KEEP OFF',blocksVehicles:true},
  {id:'no_items',label:'Keep clear: no items',short:'KEEP CLEAR',blocksVehicles:false},
  {id:'closed',label:'Closed to everyone',short:'CLOSED',blocksVehicles:true}];
const DEFAULT_STATUSES=[
  {id:'todo',label:'Not started',base:'todo',core:true},
  {id:'started',label:'In progress',base:'started',core:true},
  {id:'done',label:'Done',base:'done',core:true}];
const BASE_LABEL={todo:'Not started',started:'In progress',done:'Done'};
// how each kind of item is drawn; your own item types pick one of these looks
const LOOKS={
  area:{geom:'poly',label:'Plain area in the vendor’s colour'},
  turf:{geom:'poly',label:'Grass pattern (turf)'},
  dropoff:{geom:'poly',label:'Drop-off / storage (items allowed until a date)'},
  nogo:{geom:'poly',label:'No-go zone (hazard stripes, no work)'},
  wall:{geom:'line',label:'Thick solid line (wall)'},
  fence_high:{geom:'line',label:'Line with posts (high fence)'},
  fence_low:{geom:'line',label:'Dotted line (low fence)'},
  cable:{geom:'line',label:'Orange dashed line (cables)'},
  route:{geom:'line',label:'Wide grey band (vehicle route)'}};
const BASE_LOOK={structure:'area',stage:'area',furniture:'area',area:'area',turf:'turf',dropoff:'dropoff',nogo:'nogo',wall:'wall',fence_high:'fence_high',fence_low:'fence_low',cable:'cable',route:'route'};
function restrictions(){return (Store.d.lists&&Store.d.lists.restrictions)||DEFAULT_RESTRICTIONS;}
function restrictLabel(id){if(!id||id==='none')return 'No restriction';return restrictions().find(r=>r.id===id)?.label||'Restricted';}
function restrictShort(id){const r=restrictions().find(x=>x.id===id);return r?(r.short||r.label).toUpperCase():'';}
function blocksVehicles(id){return !!restrictions().find(r=>r.id===id)?.blocksVehicles;}
function statuses(){return (Store.d.lists&&Store.d.lists.statuses)||DEFAULT_STATUSES;}
function statusBase(id){return statuses().find(s=>s.id===id)?.base||(BASE_LABEL[id]?id:'todo');}
function statusLabel(id){return statuses().find(s=>s.id===id)?.label||BASE_LABEL[statusBase(id)];}
const canManage=()=>Store.canEdit&&!!Store.eventId;
function listTail(kind){
  if(!canManage())return '';
  const add={restrict:'+ Add restriction…',status:'+ Add status…',type:'+ Add item type…',vendor:'+ Add vendor…',event:'+ New event…',opt:'+ Add option…'}[kind];
  const edit={restrict:'✎ Edit restrictions…',status:'✎ Edit statuses…',type:'✎ Edit item types…',vendor:'✎ Edit vendors…',event:'✎ Edit this event…',opt:'✎ Edit options…'}[kind];
  return `<option disabled>──────────</option>${add?`<option value="__add">${add}</option>`:''}<option value="__edit">${edit}</option>`;
}
function restrictOptions(sel){sel=sel||'none';return `<option value="none" ${sel==='none'?'selected':''}>No restriction</option>`+restrictions().map(r=>`<option value="${esc(r.id)}" ${r.id===sel?'selected':''}>${esc(r.label)}</option>`).join('')+(sel!=='none'&&!restrictions().some(r=>r.id===sel)?`<option value="${esc(sel)}" selected>(removed restriction)</option>`:'')+listTail('restrict');}
function statusOptions(sel){sel=sel||'todo';const list=statuses();return list.map(s=>`<option value="${esc(s.id)}" ${s.id===sel?'selected':''}>${esc(s.label)}</option>`).join('')+(!list.some(s=>s.id===sel)?`<option value="${esc(sel)}" selected>${esc(statusLabel(sel))}</option>`:'')+listTail('status');}
function typeOptions(sel){return Object.entries(TYPES).map(([k,t])=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(t.name)}${t.hidden?' (hidden)':''}</option>`).join('')+listTail('type');}
function rebuildTypes(){
  Object.keys(TYPES).forEach(k=>delete TYPES[k]);
  const ov=(Store.d&&Store.d.types)||{};
  Object.entries(BASE_TYPES).forEach(([k,t])=>{const o=ov[k]||{};const T={...t,look:BASE_LOOK[k],builtin:true};['name','task','days','after','hidden'].forEach(f=>{if(o[f]!==undefined&&o[f]!=='')T[f]=o[f];});TYPES[k]=T;});
  Object.entries(ov).forEach(([k,o])=>{
    if(!o||!o.custom||BASE_TYPES[k])return;
    const look=LOOKS[o.look]?o.look:'area';
    TYPES[k]={name:o.name||'New item',geom:LOOKS[look].geom,look,task:o.task||'Install',days:Number(o.days)||1,after:o.after||'none',hidden:!!o.hidden,custom:true,
      drop:look==='dropoff',route:look==='route',noTask:look==='route'||look==='nogo'||!!o.noTask};
  });
  TYPE_GROUPS.length=0;
  const vis=g=>Object.keys(TYPES).filter(k=>TYPES[k].geom===g&&!TYPES[k].hidden);
  TYPE_GROUPS.push(['Areas · click each corner',vis('poly')],['Lines · click each point',vis('line')]);
}
const lookOf=type=>TYPES[type]?.look||'area';
function usageOfType(k){return Object.values(Z()).filter(z=>z.type===k).length;}

/* ----- a dialog to add one entry ----- */
function openAddItem({title,intro,fields,onSave}){
  openModal(`<div class="mh"><h2>${esc(title)}</h2>${intro?`<p>${esc(intro)}</p>`:''}</div>
  <form class="mb" id="ai_f">${fields.map(f=>fieldHtml('ai_'+f.key,f,f.value)).join('')}</form>
  <div class="mf"><span></span><div class="row"><button class="btn" id="ai_c" type="button">Cancel</button><button class="btn primary" id="ai_s" type="button">Add</button></div></div>`,m=>{
    const save=()=>{const v={};for(const f of fields){const el=m.querySelector('#ai_'+f.key);v[f.key]=f.type==='check'?el.checked:el.value.trim();if(f.required&&!v[f.key]){toast(`Fill in “${f.label}”.`);el.focus();return;}}closeModal();onSave(v);};
    m.querySelector('#ai_c').onclick=closeModal;m.querySelector('#ai_s').onclick=save;m.querySelector('#ai_f').addEventListener('submit',e=>{e.preventDefault();save();});
  });
}
function fieldHtml(id,f,val){
  if(f.type==='check')return `<label class="row" style="font-size:13px"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.label)}</label>`;
  if(f.type==='select')return `<div class="field"><label for="${id}">${esc(f.label)}</label><select class="sel" id="${id}">${f.options.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>${f.help?`<span class="muted" style="font-size:12px">${esc(f.help)}</span>`:''}</div>`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label><input class="inp" id="${id}" type="${f.type==='number'?'number':'text'}" ${f.type==='number'?'min="0.5" step="0.5"':''} value="${esc(val??'')}" placeholder="${esc(f.placeholder||'')}">${f.help?`<span class="muted" style="font-size:12px">${esc(f.help)}</span>`:''}</div>`;
}

/* ----- a dialog to edit a whole list: rename, reorder, add, remove ----- */
function openListEditor({title,intro,items,columns,newItem,locked,inUse,onSave}){
  let rows=clone(items);const removed=[];
  const draw=m=>{
    m.querySelector('#le_rows').innerHTML=rows.map((r,i)=>{
      const lock=locked&&locked(r);const used=inUse?inUse(r):0;
      return `<div class="qed" data-i="${i}"><div style="display:flex;flex-direction:column;gap:2px"><button class="btn small ghost" data-up="${i}" type="button" aria-label="Move up" ${i?'':'disabled'}>▲</button><button class="btn small ghost" data-dn="${i}" type="button" aria-label="Move down" ${i<rows.length-1?'':'disabled'}>▼</button></div>
      <div class="field" style="gap:5px">${columns.map(c=>{const id=`le_${i}_${c.key}`;const v=r[c.key];
        if(c.type==='check')return `<label class="row muted" style="font-size:12.5px"><input type="checkbox" id="${id}" data-k="${c.key}" ${v?'checked':''} ${c.lockable&&lock?'disabled':''}> ${esc(c.label)}</label>`;
        if(c.type==='color')return `<label class="row muted" style="font-size:12.5px"><input type="color" id="${id}" data-k="${c.key}" value="${esc(v||'#868e96')}" style="width:28px;height:24px;border:none;background:none;padding:0"> ${esc(c.label)}</label>`;
        if(c.type==='select')return `<label class="row muted" style="font-size:12.5px;flex-wrap:nowrap">${esc(c.label)} <select class="sel" id="${id}" data-k="${c.key}" ${c.lockable&&lock?'disabled':''} style="flex:1;min-width:0">${c.options.map(([ov,ol])=>`<option value="${esc(ov)}" ${ov===v?'selected':''}>${esc(ol)}</option>`).join('')}</select></label>`;
        return `<input class="inp" id="${id}" data-k="${c.key}" value="${esc(v??'')}" placeholder="${esc(c.label)}" aria-label="${esc(c.label)}" ${c.mono?'style="font-family:var(--f-mono);font-size:12.5px"':''}>`;}).join('')}
        ${used?`<span class="muted" style="font-size:11.5px">Used by ${used} item${used===1?'':'s'}</span>`:''}</div>
      ${lock?`<span class="muted" style="font-size:11px" title="Built in: you can rename it but not remove it">built in</span>`:`<button class="btn small ghost danger" data-rm="${i}" type="button" aria-label="Remove">✕</button>`}</div>`;}).join('')||'<div class="muted">The list is empty. Add an entry below.</div>';
  };
  const sync=m=>{m.querySelectorAll('#le_rows [data-k]').forEach(el=>{const i=+el.closest('[data-i]').dataset.i;rows[i][el.dataset.k]=el.type==='checkbox'?el.checked:el.value;});};
  openModal(`<div class="mh"><h2>${esc(title)}</h2>${intro?`<p>${esc(intro)}</p>`:''}</div>
  <div class="mb"><div id="le_rows" style="display:flex;flex-direction:column;gap:6px"></div><button class="btn small" id="le_add" type="button" style="align-self:flex-start">+ Add</button></div>
  <div class="mf"><span></span><div class="row"><button class="btn" id="le_c" type="button">Cancel</button><button class="btn primary" id="le_s" type="button">Save list</button></div></div>`,m=>{
    draw(m);
    m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!m.querySelector('#le_rows').contains(b))return;sync(m);
      if(b.dataset.up){const i=+b.dataset.up;[rows[i-1],rows[i]]=[rows[i],rows[i-1]];draw(m);}
      else if(b.dataset.dn){const i=+b.dataset.dn;[rows[i+1],rows[i]]=[rows[i],rows[i+1]];draw(m);}
      else if(b.dataset.rm){const i=+b.dataset.rm;const used=inUse?inUse(rows[i]):0;
        if(used&&!b.dataset.armed){b.dataset.armed='1';b.textContent='Remove?';b.title=`Used by ${used} item${used===1?'':'s'}. Click again to remove.`;return;}
        removed.push(rows[i]);rows.splice(i,1);draw(m);}});
    m.querySelector('#le_add').onclick=()=>{sync(m);rows.push(newItem());draw(m);const ins=m.querySelectorAll('#le_rows input.inp');const last=ins[ins.length-1];last&&last.focus();};
    m.querySelector('#le_c').onclick=closeModal;
    m.querySelector('#le_s').onclick=()=>{sync(m);const first=columns.find(c=>!c.type||c.type==='text');if(first&&rows.some(r=>!String(r[first.key]||'').trim())){toast(`Every entry needs a ${first.label.toLowerCase()}.`);return;}closeModal();onSave(rows,removed);};
  });
}

/* ----- one item type: name, look, default work ----- */
function openTypeEditor(key,onDone,preset){
  const isNew=!key;const pg=preset&&preset.geom==='line'?'line':'poly';
  const T=key?TYPES[key]:{name:'',geom:pg,look:pg==='line'?'wall':'area',task:'Install',days:1,after:'none',custom:true};
  const used=key?usageOfType(key):0;const lockShape=!isNew&&(T.builtin||used>0);
  const looks=Object.entries(LOOKS).filter(([k,l])=>!(lockShape||preset)||l.geom===T.geom);
  openModal(`<div class="mh"><h2>${isNew?(preset?(pg==='line'?'New line type':'New area type'):'New item type'):'Edit “'+esc(T.name)+'”'}</h2><p>${isNew?'It appears in the toolbar on the left. When you draw one, the board asks your questions for it.':T.builtin?'A built-in type: you can rename it and change its defaults.':'Your own item type.'}</p></div>
  <form class="mb" id="te_f">
    ${fieldHtml('te_name',{label:'Name',placeholder:'e.g. Tent, Barrier, Signage, Toilets'},T.name)}
    ${T.builtin?'':fieldHtml('te_look',{type:'select',label:'How it looks on the map',options:looks.map(([k,l])=>[k,(l.geom==='poly'?'Area — ':'Line — ')+l.label]),help:lockShape?'Already drawn on the plan, so it stays an '+(T.geom==='poly'?'area':'line')+'.':'Areas are drawn corner by corner, lines point by point.'},T.look)}
    ${fieldHtml('te_task',{label:'Default work name',placeholder:'e.g. Pitch tent'},T.task)}
    ${fieldHtml('te_days',{type:'number',label:'Default days to install'},T.days)}
    <div class="field"><label for="te_after">Once installed (default)</label><select class="sel" id="te_after" data-list="restrict">${restrictOptions(T.after||'none')}</select></div>
    ${fieldHtml('te_hidden',{type:'check',label:'Hide from the toolbar'},T.hidden)}
  </form>
  <div class="mf">${!isNew&&!T.builtin&&!used?'<button class="btn ghost danger" id="te_del" type="button">Delete type</button>':'<span></span>'}<div class="row"><button class="btn" id="te_c" type="button">Cancel</button><button class="btn primary" id="te_s" type="button">${isNew?'Add item type':'Save'}</button></div></div>`,m=>{
    m.querySelector('#te_c').onclick=closeModal;
    const del=m.querySelector('#te_del');if(del)del.onclick=()=>confirmBtn(del,()=>{const t={...Store.d.types};delete t[key];Store.d.types=t;closeModal();Store.touch();rebuildTypes();refreshLists('type');onDone&&onDone(null);});
    m.querySelector('#te_s').onclick=()=>{
      const name=m.querySelector('#te_name').value.trim();if(!name){toast('Give the item type a name.');return;}
      const o={name,task:m.querySelector('#te_task').value.trim()||'Install',days:Math.max(0.5,parseFloat(m.querySelector('#te_days').value)||1),after:m.querySelector('#te_after').value,hidden:m.querySelector('#te_hidden').checked};
      if(o.after==='__add'||o.after==='__edit')o.after='none';
      let k=key;
      if(T.builtin)Store.d.types={...Store.d.types,[k]:o};
      else{if(isNew)k='c_'+slugify(name).slice(0,20)+'_'+uid().slice(0,4);Store.d.types={...Store.d.types,[k]:{...(Store.d.types[k]||{}),...o,custom:true,look:m.querySelector('#te_look').value}};}
      closeModal();rebuildTypes();Store.touch();refreshLists('type');toast(isNew?`Added “${name}”. It’s in the toolbar.`:'Saved.');onDone&&onDone(k);
    };
  });
}
function openTypeManager(){
  const draw=m=>{m.querySelector('#tm_rows').innerHTML=Object.entries(TYPES).map(([k,t])=>{const n=usageOfType(k);return `<div class="row" style="flex-wrap:nowrap;border:1px solid var(--line2);border-radius:6px;padding:6px 8px">${swatch(k)}<div style="flex:1;min-width:0"><b style="font-weight:500">${esc(t.name)}</b> <span class="muted" style="font-size:12px">· ${t.geom==='poly'?'area':'line'}${t.builtin?' · built in':''}${t.hidden?' · hidden':''}${n?` · ${n} on plan`:''}</span><div class="muted" style="font-size:12px">${t.noTask&&!t.custom?'No installation work':esc(t.task)+' · '+t.days+' day'+(t.days==1?'':'s')}</div></div><button class="btn small" data-te="${esc(k)}" type="button">Edit</button></div>`;}).join('');};

/* ----- what "+ Add…" and "✎ Edit…" do for each list ----- */
const LISTS={
  restrict:{
    add(done){openAddItem({title:'New restriction',intro:'What isn’t allowed in an area once its work is finished.',fields:[{key:'label',label:'Restriction',placeholder:'e.g. No forklifts',required:true},{key:'short',label:'Short label on the map',placeholder:'e.g. NO FORKLIFTS'},{key:'blocksVehicles',type:'check',label:'Warn me if a vehicle route crosses it',value:true}],
      onSave(v){const id='r_'+uid().slice(0,6);Store.d.lists={...Store.d.lists,restrictions:[...restrictions(),{id,label:v.label,short:v.short||v.label,blocksVehicles:v.blocksVehicles}]};Store.touch();done(id);}});},
    edit(){openListEditor({title:'Restrictions',intro:'Rename, reorder, add or remove. Areas using a removed restriction go back to “No restriction”.',items:restrictions(),
      columns:[{key:'label',label:'Restriction'},{key:'short',label:'Short label on the map',mono:true},{key:'blocksVehicles',type:'check',label:'Warn if a vehicle route crosses it'}],
      newItem:()=>({id:'r_'+uid().slice(0,6),label:'',short:'',blocksVehicles:false}),
      inUse:r=>Object.values(Z()).filter(z=>z.after===r.id).length,
      onSave(rows,removed){const gone=new Set(removed.map(r=>r.id));Store.d.lists={...Store.d.lists,restrictions:rows.map(r=>({...r,label:r.label.trim(),short:(r.short||r.label).trim()}))};
        if(gone.size)Object.entries(Z()).forEach(([id,z])=>{if(gone.has(z.after))Store.d.zones[id]={...z,after:'none'};});Store.touch();refreshLists('restrict');}});}
  },
  status:{
    add(done){openAddItem({title:'New status',intro:'For example “Waiting for materials” or “Delayed”. Pick what it counts as, so the schedule knows whether the next vendor can start.',fields:[{key:'label',label:'Status',placeholder:'e.g. Waiting for materials',required:true},{key:'base',type:'select',label:'Counts as',options:[['todo','Not started'],['started','In progress'],['done','Done (next vendor can start)']],value:'started'}],
      onSave(v){const id='s_'+uid().slice(0,6);Store.d.lists={...Store.d.lists,statuses:[...statuses(),{id,label:v.label,base:v.base}]};Store.touch();done(id);}});},
    edit(){openListEditor({title:'Task statuses',intro:'Rename, reorder or add. The three built-in statuses can be renamed but not removed.',items:statuses(),
      columns:[{key:'label',label:'Status'},{key:'base',type:'select',label:'Counts as',lockable:true,options:[['todo','Not started'],['started','In progress'],['done','Done']]}],
      locked:s=>!!s.core,newItem:()=>({id:'s_'+uid().slice(0,6),label:'',base:'started'}),

    m.querySelector('#sh_go').onclick=async()=>{if(!canvas)return;const b=await blob();const file=new File([b],fname(),{type:'image/png'});const title=m.querySelector('#sh_t').value.trim()||def;
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title,text:title});}catch(e){if(e.name!=='AbortError')download();}}
      else{toast('Sharing pictures isn’t available in this browser, so it was downloaded instead.');download();}};
    m.querySelector('#sh_txt').onclick=()=>copyText(daySummaryText(m.querySelector('#sh_t').value.trim()||def,m.querySelector('#sh_n').value.trim()),'Summary copied. Paste it into WhatsApp or email.');
    m.querySelector('#sh_c').onclick=closeModal;
  });
}

/* ============ undo / redo ============
   Every change to the plan is recorded (changes made in one go count as one step). */
const History={stack:[],i:-1,pending:null,max:100,applying:false,
  reset(){clearTimeout(this.pending);this.pending=null;this.stack=[JSON.stringify(Store.d)];this.i=0;renderUndo();},
  record(){if(this.applying)return;clearTimeout(this.pending);this.pending=setTimeout(()=>this.commit(),250);},
  commit(){clearTimeout(this.pending);this.pending=null;const j=JSON.stringify(Store.d);if(j===this.stack[this.i])return;
    this.stack=this.stack.slice(0,this.i+1);this.stack.push(j);if(this.stack.length>this.max)this.stack.shift();this.i=this.stack.length-1;renderUndo();},
  can(dir){if(this.pending)this.commit();return dir<0?this.i>0:this.i<this.stack.length-1;},
  go(dir){
    if(!editable()&&!(Store.canEdit&&ui.viewAs==='planner'))return;
    if(!this.can(dir)){toast(dir<0?'Nothing to undo.':'Nothing to redo.');return;}
    this.i+=dir;this.applying=true;
    ui.draft=null;ui.hover=null;
    Store.d=normalize(JSON.parse(this.stack[this.i]));
    if(ui.sel&&!Store.d.zones[ui.sel])ui.sel=null;
    Store.touch();this.applying=false;dataStamp++;renderAll();renderUndo();
    toast(dir<0?'Undone.':'Redone.');
  }
};
function renderUndo(){
  const box=$('#undoBox');if(!box)return;
  const show=Store.canEdit&&!!Store.eventId&&!Store.previewing&&Store.role!=='vendor';
  box.hidden=!show;
  $('#btnUndo').disabled=!(History.i>0||History.pending);$('#btnRedo').disabled=!(History.i<History.stack.length-1);
}
$('#btnUndo').onclick=()=>History.go(-1);
$('#btnRedo').onclick=()=>History.go(1);
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;
  const k=e.key.toLowerCase();if(k!=='z'&&k!=='y')return;
  // text boxes keep their own undo
  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;
  if($('#modalRoot').firstChild)return;
  if(!Store.canEdit||Store.previewing)return;
  e.preventDefault();
  if(ui.draft&&k==='z'&&!e.shiftKey){ui.draft.pts.pop();if(!ui.draft.pts.length)ui.draft=null;renderDraft();return;} // while drawing: remove the last point
  History.go(k==='y'||e.shiftKey?1:-1);
});

  }

async function findOldGithubData(){
  try{const r=await fetch('data/events.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const list=await r.json();if(Array.isArray(list)&&list.length)return list.map(e=>({...e,path:e.id==='plan'?'data/plan.json':`data/events/${e.id}.json`}));}}catch(e){}
  try{const r=await fetch('data/plan.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const w=await r.json();return [{id:'plan',name:w?.data?.settings?.name||'Event',path:'data/plan.json'}];}}catch(e){}

async function importOldGithub(list,btn){
