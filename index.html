<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Build-Up Site Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: site-office board — drawing sheet in the middle, tool rail left, schedule/brief panel right, day scrubber under the sheet */
:root{
  --bg:#eef0ec; --sheet:#fbfcf9; --panel:#ffffff; --fg:#1d2420; --muted:#5f6b64; --line:#d3d8d2; --line2:#e4e8e3;
  --accent:#e8590c; --accent-ink:#ffffff; --snap:#0b7285; --hazard:#f2a516; --hazard2:#1d2420;
  --ok:#2f8f4e; --warn:#c77c02; --bad:#c92a2a; --info:#3b6fb6;
  --grid:#dfe4de; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.08);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a17; --sheet:#1b211e; --panel:#1f2622; --fg:#e6ebe7; --muted:#9aa69f; --line:#34403a; --line2:#2a332e;
  --accent:#ff7a2e; --accent-ink:#1a1008; --snap:#3bc9db; --hazard:#e6a019; --hazard2:#151a17;
  --ok:#55c27a; --warn:#e6a019; --bad:#ff6b6b; --info:#7aa7ea; --grid:#28312c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a17; --sheet:#1b211e; --panel:#1f2622; --fg:#e6ebe7; --muted:#9aa69f; --line:#34403a; --line2:#2a332e;
  --accent:#ff7a2e; --accent-ink:#1a1008; --snap:#3bc9db; --hazard:#e6a019; --hazard2:#151a17;
  --ok:#55c27a; --warn:#e6a019; --bad:#ff6b6b; --info:#7aa7ea; --grid:#28312c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.top .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.evpick{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.choice b{font-weight:600}
.danger-zone{border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.on{border-color:var(--snap);color:var(--snap)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-width:0}
.pill{font-family:var(--f-mono);font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}
.main{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(320px,400px);gap:12px;min-height:0}
.rail{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow-y:auto;width:180px}
.rail h3{margin:6px 4px 2px;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tool{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:6px;padding:5px 6px;text-align:left;font-size:13px}
.tool:hover{background:var(--line2)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tool svg{flex:none}
.sheetwrap{display:flex;flex-direction:column;min-height:0;min-width:0;gap:8px}
.sheet{position:relative;flex:1;min-height:0;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.sheet svg#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet.drawing svg#map{cursor:crosshair}
.mapbar{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-direction:column}
.mapbar .btn{padding:4px 8px;justify-content:center;min-width:32px}
.hint{position:absolute;left:8px;bottom:8px;right:60px;font-size:12.5px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:6px;padding:5px 9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.banner{position:absolute;top:8px;left:8px;right:56px;font-size:12.5px;background:var(--panel);border:1px solid var(--warn);border-radius:6px;padding:6px 10px}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;pointer-events:none}
.empty .box{pointer-events:auto;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--f-display);margin:0 0 6px;font-size:24px}
.scrub{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.scrub .day{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1;min-width:150px}
.scrub .day small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.scrub input[type=range]{width:100%;accent-color:var(--accent)}
.ticks{grid-column:2;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.legend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:none;padding:10px 12px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:var(--sheet);border-radius:999px;padding:0 6px}
.pbody{overflow-y:auto;padding:12px;min-height:0;flex:1;display:flex;flex-direction:column;gap:12px}
.sec h4{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.meas{display:flex;gap:16px;flex-wrap:wrap}
.meas div{display:flex;flex-direction:column}
.meas b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.meas span{font-size:11px;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.gantt{overflow-x:auto;border:1px solid var(--line2);border-radius:8px}
.grow{display:grid;grid-template-columns:150px 1fr;min-width:420px;border-bottom:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.grow:hover{background:var(--line2)}
.grow.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.grow .gl{padding:5px 8px;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line2)}
.grow .gl b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gl span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{position:relative}
.gt .bar{position:absolute;top:8px;bottom:8px;border-radius:3px;min-width:6px}
.gt .bar.done{opacity:.45}
.gt .now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.gt .ev{position:absolute;top:0;bottom:0;border-left:2px dashed var(--bad)}
.ghead{display:grid;grid-template-columns:150px 1fr;min-width:420px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.ghead .gt{display:flex}
.ghead .gt div{flex:1;padding:4px 0 4px 3px;border-left:1px solid var(--line2);white-space:nowrap;overflow:hidden}
.task{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.task .t1{display:flex;gap:8px;align-items:center}
.task .t1 input{flex:1}
.st{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.st.done{color:var(--ok)} .st.ready{color:var(--accent)} .st.wait{color:var(--muted)} .st.started{color:var(--info)}
.conf{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.conf.critical{border-left-color:var(--bad)} .conf.info{border-left-color:var(--info)}
.conf b{font-weight:600}
.brief{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--line2);border-radius:8px;padding:10px;overflow-x:auto}
.vrow{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;border:1px solid var(--line);border-radius:8px;padding:8px;align-items:center}
.vrow input[type=color]{width:28px;height:28px;border:none;background:none;padding:0}
.modal{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;border:1px solid var(--line);min-height:0}
.modal .mb{min-height:0}
.modal .mh{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-family:var(--f-display);font-size:24px}
.modal .mh p{margin:2px 0 0;color:var(--muted);font-size:13px}
.modal .mb{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.q{display:flex;flex-direction:column;gap:6px}
.q > label.ql,.q > .ql{font-weight:600;font-size:13.5px}
.q .help{font-size:12px;color:var(--muted)}
.chks{display:flex;flex-direction:column;gap:2px;max-height:170px;overflow-y:auto;border:1px solid var(--line2);border-radius:6px;padding:6px}
.chks label{display:flex;gap:7px;align-items:center;font-size:13px;padding:2px}
.chks .grp{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.follow{display:grid;grid-template-columns:1fr 120px 64px auto;gap:6px;align-items:center}
.qed{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:6px;padding:6px}
.qed .kind{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--sheet);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.zl{font-family:var(--f-display);font-weight:600;font-size:15px;paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.zs{font-family:var(--f-mono);font-size:9.5px;paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.ml{font-family:var(--f-mono);font-size:11px;font-weight:500;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.main.norail{grid-template-columns:minmax(0,1fr) minmax(320px,400px)}
@media (max-width:1100px){.main{grid-template-columns:auto minmax(0,1fr)}.main.norail{grid-template-columns:minmax(0,1fr)}.panel{grid-column:1/-1}}
@media (max-width:720px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;width:auto;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap}
  .rail h3{display:none}.tool{flex:none}
  .sheet{height:62svh;flex:none}
  .follow{grid-template-columns:1fr 1fr}
  .brand h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><small id="dates">Build-up board</small><h1 id="planName">Site board</h1></div>
    <div class="ctl">
      <span class="save" id="saveState"></span>
      <span class="evpick" id="evPick"><label class="muted" for="eventSel" style="font-size:12px">Event</label>
      <select id="eventSel" class="sel" style="max-width:220px" data-list="event"></select>
      <button class="btn" id="btnNewEvent" type="button" hidden>+ New event</button></span>
      <label class="muted" for="viewAs" style="font-size:12px">Viewing as</label>
      <select id="viewAs" class="sel" data-list="vendor"></select>
      <button class="btn" id="btnLogin" type="button" hidden>Planner sign-in</button>
      <button class="btn" id="btnSettings" type="button">Event settings</button>
    </div>
  </header>
  <div class="main">
    <nav class="rail" id="rail" aria-label="Drawing tools"></nav>
    <div class="sheetwrap">
      <div class="sheet" id="sheet">
        <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" aria-label="Site map">
          <defs>
            <pattern id="hz" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)"><rect width="16" height="16" style="fill:var(--hazard2)" opacity=".85"/><rect width="8" height="16" style="fill:var(--hazard)"/></pattern>
            <pattern id="turfp" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M2 8 l1.5-4 M6 9 l1-3.5" style="stroke:var(--ok)" stroke-width="1" fill="none" opacity=".7"/></pattern>
            <pattern id="dropp" patternUnits="userSpaceOnUse" width="12" height="12"><circle cx="3" cy="3" r="1.4" style="fill:var(--ok)"/></pattern>
            <pattern id="dropbad" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)"><rect width="3" height="12" style="fill:var(--bad)" opacity=".5"/></pattern>
            <pattern id="grid" patternUnits="userSpaceOnUse" width="50" height="50"><path d="M50 0H0V50" fill="none" style="stroke:var(--grid)" stroke-width="1"/></pattern>
          </defs>
          <rect x="-5000" y="-5000" width="11000" height="11000" fill="url(#grid)"/>
          <image id="bgimg" x="0" y="0" width="1000" height="640" preserveAspectRatio="none" style="display:none"/>
          <rect id="sheetedge" x="0" y="0" width="1000" height="640" fill="none" style="stroke:var(--line)" stroke-dasharray="4 4"/>
          <g id="zonesL"></g>
          <g id="draftL" pointer-events="none"></g>
          <g id="handlesL"></g>
        </svg>
        <div class="mapbar">
          <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
          <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
          <button class="btn" id="zfit" type="button" aria-label="Fit to sheet" style="font-size:11px">Fit</button>
        </div>
        <div class="banner" id="banner" hidden></div>
        <div class="hint" id="hint" hidden></div>
        <div class="empty" id="empty" hidden></div>
      </div>
      <div class="scrub">
        <div class="day" id="dayLabel"><small>Showing</small>—</div>
        <input type="range" id="day" min="0" max="7" step="0.5" value="0" aria-label="Day of build-up">
        <div class="ticks" id="ticks"></div>
        <div class="legend">
          <span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--hazard) 0 4px,var(--hazard2) 4px 8px)"></i>Locked: vendor installing</span>
          <span><i class="sw" style="border:1.5px dashed var(--muted)"></i>Upcoming</span>
          <span><i class="sw" style="background:var(--muted);opacity:.5"></i>Installed</span>
          <span><i class="sw" style="background:radial-gradient(var(--ok) 30%,transparent 35%) 0 0/5px 5px"></i>Drop-off open</span>
          <span><i class="sw" style="border:2px solid var(--bad)"></i>Restriction in force</span>
        </div>
      </div>
    </div>
    <section class="panel" aria-label="Plan details">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pbody" id="pbody"></div>
    </section>
  </div>
</div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ============ CONFIG ============ */
const CONFIG={
  // Your GitHub repository. Leave owner and repo empty when the board runs on <you>.github.io/<repo>/ — they are read from the address.
  // Fill them in if you use your own domain, e.g. owner:'my-company', repo:'site-board'.
  owner:'',
  repo:'',
  branch:'main',              // the branch GitHub Pages publishes from
  planPath:'data/plan.json',  // where the first event is saved in the repository
  eventsDir:'data/events',    // where every other event is saved
  indexPath:'data/events.json', // the list of events
  pollSeconds:60,             // how often vendor pages check for updates
  saveDelaySeconds:3,         // wait this long after your last change before saving (each save is one commit)
  maxImageMB:20,              // largest floor plan image
  snapPixels:11,              // how close (on screen) the cursor must be to snap to a corner or edge
  snapDegrees:6,              // how close a line must be to straight / 45° / square to snap
  apiBase:'https://api.github.com',
  rawBase:'https://raw.githubusercontent.com'
};
if(window.SITEBOARD_CONFIG)Object.assign(CONFIG,window.SITEBOARD_CONFIG);

/* ============ constants ============ */
const W=1000;
const BASE_TYPES={
  structure:{name:'Caravan / structure',geom:'poly',task:'Place',days:1},
  stage:{name:'Stage',geom:'poly',task:'Build stage',days:2,follow:[{title:'Stairs',days:1},{title:'Paint stage',days:1},{title:'Furniture',days:1},{title:'Numbering',days:0.5}],power:true},
  turf:{name:'Turf',geom:'poly',task:'Install turf',days:2,after:'no_walking'},
  furniture:{name:'Furniture area',geom:'poly',task:'Set up furniture',days:1},
  area:{name:'Other work area',geom:'poly',task:'Install',days:1},
  dropoff:{name:'Drop-off / storage',geom:'poly',drop:true},
  nogo:{name:'No-go zone',geom:'poly',noTask:true,after:'closed'},
  wall:{name:'Wall',geom:'line',task:'Build wall',days:1},
  fence_high:{name:'High fence',geom:'line',task:'Install high fence',days:1},
  fence_low:{name:'Low fence',geom:'line',task:'Install low fence',days:1},
  cable:{name:'Electrical cables',geom:'line',task:'Lay cables',days:1,after:'no_vehicles'},
  route:{name:'Vehicle route',geom:'line',noTask:true,route:true}
};

function normalize(d){
  d=d&&typeof d==='object'?d:emptyPlan();
  ['vendors','zones','tasks','templates'].forEach(k=>{if(!d[k]||typeof d[k]!=='object')d[k]={};});

    z.pts=Array.isArray(z.pts)?z.pts:[];z.parallel=z.parallel||[];z.answers=z.answers||{};
  });
  Object.values(d.tasks).forEach(t=>{t.deps=Array.isArray(t.deps)?t.deps:[];});
  d.lists=d.lists&&typeof d.lists==='object'?d.lists:{};

  if(!Array.isArray(d.lists.statuses))d.lists.statuses=clone(DEFAULT_STATUSES);

}

/* ============ storage: your GitHub repository, or this browser ============
   The plan lives in data/plan.json inside the repository.
   Everyone reads it through GitHub's public API (no sign-in needed).
   The planner saves with a personal access token kept only in their own browser. */
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}

function repoInfo(){
  let owner=CONFIG.owner,repo=CONFIG.repo;
  if((!owner||!repo)&&/\.github\.io$/i.test(location.hostname)){
    owner=owner||location.hostname.split('.')[0];
    const seg=location.pathname.split('/').filter(Boolean)[0];
    repo=repo||(seg&&!/\.html?$/i.test(seg)?seg:location.hostname.toLowerCase());
  }
  return owner&&repo?{owner,repo}:null;

const GH={
  url(path){const r=repoInfo();return `${CONFIG.apiBase}/repos/${r.owner}/${r.repo}${path||''}`;},
  headers(token,accept){const h={Accept:accept||'application/vnd.github+json'};if(token)h.Authorization='Bearer '+token;return h;},
  err(r,j){const e=new Error((j&&j.message)||('GitHub error '+r.status));e.status=r.status;e.limited=r.status===403&&r.headers.get('x-ratelimit-remaining')==='0'||r.status===429;return e;},
  // returns {sha, json}; throws with e.missing when the file doesn't exist
  async readJson(token,path){
    const u=this.url('/contents/'+path)+'?ref='+encodeURIComponent(CONFIG.branch);
    const r=await fetch(u,{headers:this.headers(token),cache:'no-cache'});
    if(r.status===404){const e=this.err(r,await r.json().catch(()=>null));e.missing=true;throw e;}
    if(!r.ok)throw this.err(r,await r.json().catch(()=>null));
    const j=await r.json();let text;
    if(j.encoding==='base64'&&j.content)text=b64dec(j.content);
    else{const r2=await fetch(u,{headers:this.headers(token,'application/vnd.github.raw+json'),cache:'no-cache'});if(!r2.ok)throw this.err(r2,null);text=await r2.text();}
    let json=null;try{json=JSON.parse(text);}catch(e){}
    return {sha:j.sha,json};
  },
  async repoExists(token){const r=await fetch(this.url(''),{headers:this.headers(token),cache:'no-cache'});if(r.ok)return await r.json();if(r.status===404)return null;throw this.err(r,await r.json().catch(()=>null));},
  async put(token,path,b64,sha,message){
    const r=await fetch(this.url('/contents/'+path),{method:'PUT',headers:{...this.headers(token),'Content-Type':'application/json'},body:JSON.stringify({message,content:b64,branch:CONFIG.branch,...(sha?{sha}:{})})});
    const j=await r.json().catch(()=>null);
    if(!r.ok){const e=this.err(r,j);e.conflict=r.status===409||(r.status===422&&/sha/i.test(e.message));throw e;}
    return j.content.sha;
  },
  async remove(token,path,sha,message){
    const r=await fetch(this.url('/contents/'+path),{method:'DELETE',headers:{...this.headers(token),'Content-Type':'application/json'},body:JSON.stringify({message,sha,branch:CONFIG.branch})});
    if(!r.ok&&r.status!==404){const e=this.err(r,await r.json().catch(()=>null));e.conflict=r.status===409||r.status===422;throw e;}
  },
  // fallback for viewers when GitHub's hourly limit for signed-out visitors is used up: the copy GitHub Pages serves
  async readPages(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Pages '+r.status);return {sha:null,json:await r.json()};}

/* Each event is its own file. The very first event ("plan") keeps the original data/plan.json path,
   so a board set up before multiple events existed keeps working. */
function evPath(id){return id==='plan'?CONFIG.planPath:`${CONFIG.eventsDir}/${id}.json`;}

function evEntry(id,d){const s=(d&&d.settings)||{};return {id,name:s.name||'Untitled event',setupStart:s.setupStart||'',eventDate:s.eventDate||''};}

function shiftISO(iso,days){if(!iso)return iso;const d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setUrlEvent(id){try{const u=new URL(location.href);if(id)u.searchParams.set('event',id);else u.searchParams.delete('event');history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(e){}}

const Store={mode:'loading',d:emptyPlan(),version:0,sha:null,canEdit:false,token:'',dirty:false,saving:false,again:false,lockedVendor:null,lastSaved:null,problem:'',events:[],eventId:null,
  async init(){
    const qs=new URLSearchParams(location.search);this.lockedVendor=qs.get('vendor');
    const wanted=qs.get('event');

    const info=location.protocol==='file:'?null:repoInfo();
    if(info){
      this.mode='github';
      try{await this.loadIndex();}catch(e){this.problem='Could not load the event list from GitHub ('+e.message+').';}
      const id=this.pickEvent(wanted);

      if(!this.problem&&!this.events.length){try{const repo=await GH.repoExists(this.token);if(!repo)this.problem=`Can’t find the repository ${info.owner}/${info.repo}. Check owner and repo at the top of index.html.`;}catch(e){}}

  pickEvent(wanted){

  // read-modify-write of the event list, retrying if someone else changed it meanwhile

  apply(res){this.sha=res.sha;const w=res.json;this.version=w&&w.version||0;this.d=normalize(w&&w.data?w.data:emptyPlan());},

/* ============ schedule ============ */
/* A task can be a job with ordered steps (subtasks). Steps run one after another;
   a step marked "withPrev" runs alongside the step before it. A job spans its steps,
   and anything that waits for a job waits for all of its steps. */
let SCH={},CYC=new Set(),EDEPS={},KIDS={},STATE={};
function computeSchedule(){
  const T=TK();SCH={};CYC=new Set();EDEPS={};KIDS={};STATE={};const vis={};
  Object.entries(T).forEach(([id,t])=>{if(t.parentId&&T[t.parentId])(KIDS[t.parentId]=KIDS[t.parentId]||[]).push(id);});
  Object.values(KIDS).forEach(a=>a.sort((x,y)=>(T[x].order??0)-(T[y].order??0)));
  function go(id){
    if(SCH[id])return SCH[id];
    if(vis[id]){CYC.add(id);return {s:0,e:0};}
    vis[id]=1;const t=T[id];const ks=KIDS[id];
    if(ks&&ks.length){ks.forEach(go);const r={s:Math.min(...ks.map(k=>SCH[k].s)),e:Math.max(...ks.map(k=>SCH[k].e))};SCH[id]=r;EDEPS[id]=(t.deps||[]).filter(d=>T[d]);return r;}
    let deps=[...(t.deps||[])],s=0,nb=offOf(t.notBefore);
    const p=t.parentId&&T[t.parentId];
    if(p){const sib=KIDS[t.parentId];const i=sib.indexOf(id);
      if(i===0){deps.push(...(p.deps||[]));const pnb=offOf(p.notBefore);if(pnb!=null)nb=nb==null?pnb:Math.max(nb,pnb);}
      else if(t.withPrev){const pr=sib[i-1];s=Math.max(s,go(pr).s);deps.push(...(EDEPS[pr]||[]));}
      else{let m=i-1;deps.push(sib[m]);while(m>0&&T[sib[m]].withPrev){m--;deps.push(sib[m]);}}
    }
    deps=[...new Set(deps.filter(d=>T[d]&&d!==id))];EDEPS[id]=deps;
    if(nb!=null)s=Math.max(s,nb);
    deps.forEach(d=>{s=Math.max(s,go(d).e);});
    const r={s,e:s+Math.max(0.5,Number(t.days)||1)};SCH[id]=r;return r;
  }
  Object.keys(T).forEach(go);
}
const isParent=id=>!!(KIDS[id]&&KIDS[id].length);
const isLeaf=id=>!isParent(id);
function taskLabel(id){const t=TK()[id];if(!t)return '';const p=t.parentId&&TK()[t.parentId];return p?`${p.title} › ${t.title}`:t.title;}

  if(STATE[id])return STATE[id]==='…'?'wait':STATE[id];

/* ============ geometry ============ */
function edges(z){const p=z.pts||[];const r=[];for(let i=1;i<p.length;i++)r.push([p[i-1],p[i]]);if(z.geom==='poly'&&p.length>2)r.push([p[p.length-1],p[0]]);return r;}
function orient(a,b,c){return (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);}
function segX(a,b,c,d){const d1=orient(c,d,a),d2=orient(c,d,b),d3=orient(a,b,c),d4=orient(a,b,d);return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));}
function pip(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))ins=!ins;}return ins;}
function overlap(a,b){
  if(!a||!b||!a.pts||!b.pts)return false;
  const ea=edges(a),eb=edges(b);
  if(ea.some(([p,q])=>eb.some(([r,s])=>segX(p,q,r,s))))return true;
  const mid=(e)=>({x:(e[0].x+e[1].x)/2,y:(e[0].y+e[1].y)/2});
  if(a.geom==='poly'&&(b.pts.some(p=>pip(p,a.pts))||eb.some(e=>pip(mid(e),a.pts))))return true;
  if(b.geom==='poly'&&(a.pts.some(p=>pip(p,b.pts))||ea.some(e=>pip(mid(e),b.pts))))return true;

}
function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;a+=p[i].x*p[j].y-p[j].x*p[i].y;}return a/2;}

function bbox(z){const xs=z.pts.map(p=>p.x),ys=z.pts.map(p=>p.y);return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function lengthOf(z){return edges(z).reduce((s,[a,b])=>s+dist(a,b),0);}
function nearestOnSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y;const L=dx*dx+dy*dy;if(!L)return {...a};const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L,0,1);return {x:a.x+t*dx,y:a.y+t*dy};}
function mPer(){return Number(S().mPerUnit)||0;}
function fmtLen(u){const m=mPer();return m?(u*m>=100?Math.round(u*m):r1(u*m))+' m':Math.round(u)+' u';}
function fmtArea(u2){const m=mPer();return m?Math.round(u2*m*m).toLocaleString()+' m²':Math.round(u2).toLocaleString()+' u²';}
function polyPts(p){return p.map(q=>q.x+','+q.y).join(' ');}

/* ============ snapping ============ */
function pxUnits(px){const r=$('#map').getBoundingClientRect();return px*ui.vb.w/(r.width||1000);}
// ctx: {prev, prevPrev, first, skipZone, skipIdx, extra:[points]}
function snapPoint(raw,ctx){
  ctx=ctx||{};
  const res={p:{x:r1(raw.x),y:r1(raw.y)},kind:null,guides:[],closes:false};
  if(!ui.snap||ui.shift)return res;
  const tol=pxUnits(CONFIG.snapPixels);
  const verts=[];const segsAll=[];
  Object.entries(Z()).forEach(([id,z])=>{
    (z.pts||[]).forEach((p,i)=>{if(id===ctx.skipZone&&i===ctx.skipIdx)return;verts.push(p);});
    edges(z).forEach((e,i)=>{if(id===ctx.skipZone&&ctx.skipIdx!=null){const n=z.pts.length;const a=i,b=(i+1)%n;if(a===ctx.skipIdx||b===ctx.skipIdx)return;}segsAll.push(e);});
  });

  if(best){res.p={x:best.x,y:best.y};res.kind='vertex';res.closes=!!(ctx.first&&best===ctx.first);return res;}

  if(ctx.prev){

      if(ctx.prevPrev){const pa=Math.atan2(pv.y-ctx.prevPrev.y,pv.x-ctx.prevPrev.x)*180/Math.PI;for(let k=-2;k<=2;k++)bases.push(pa+k*90);}

  if(ay){res.p.y=ay.y;res.guides.push({a:ay,b:res.p});res.kind='align';}

}
// Make near-straight segments exactly straight (multiples of 45°, or square to the previous segment)
function straighten(z){

    const ang=Math.atan2(dy,dx)*180/Math.PI;const bases=[];for(let k=-180;k<=180;k+=45)bases.push(k);
    if(i>=2){const pa=Math.atan2(a.y-p[i-2].y,a.x-p[i-2].x)*180/Math.PI;for(let k=-2;k<=2;k++)bases.push(pa+k*90);}

/* ============ conflicts ============ */
function conflicts(){
  const out=[];const zs=Z(),T=TK();const zids=Object.keys(zs);
  CYC.forEach(id=>out.push({level:'critical',title:'Circular dependency',detail:`"${T[id]?.title}" ends up waiting on itself. Remove one of its "starts after" links.`,zones:[T[id]?.zoneId]}));
  const ev=eventOff();
  Object.keys(T).filter(isLeaf).forEach(id=>{if(SCH[id]&&SCH[id].e>ev)out.push({level:'critical',title:'Finishes after event day',detail:`${taskLabel(id)} (${vendorName(T[id].vendorId)}) ends ${fmtDay(SCH[id].e)}, after the event on ${fmtDay(ev,false)}.`,zones:[T[id].zoneId]});});
  const seen=new Set();
  for(let i=0;i<zids.length;i++)for(let j=i;j<zids.length;j++){
    const a=zs[zids[i]],b=zs[zids[j]];if(i!==j&&!overlap(a,b))continue;
    const ta=zoneTasks(zids[i]),tb=zoneTasks(zids[j]);
    ta.forEach(x=>tb.forEach(y=>{
      if(x===y)return;const k=[x,y].sort().join('|');if(seen.has(k))return;seen.add(k);
      const X=T[x],Y=T[y];if(X.vendorId===Y.vendorId)return;
      if(X.parentId&&X.parentId===Y.parentId)return; // steps of one job: you set their order yourself
      if((a.parallel||[]).includes(Y.vendorId)||(b.parallel||[]).includes(X.vendorId))return;
      const sx=SCH[x],sy=SCH[y];
      if(sx.s<sy.e&&sy.s<sx.e){

function openModal(html,onMount){const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.innerHTML=`<div class="card">${html}</div>`;$('#modalRoot').appendChild(m);m.addEventListener('pointerdown',e=>{m.dataset.down=e.target===m?'1':'';});m.addEventListener('click',e=>{if(e.target===m&&m.dataset.down)closeModal();});onMount&&onMount(m);const f=m.querySelector('input:not([type=checkbox]),select,textarea');f&&f.focus();}

function taskChecks(name,checked,exclude,pri){
  const byZone={};Object.entries(TK()).forEach(([id,t])=>{if(exclude&&exclude.has(id))return;const zl=Z()[t.zoneId]?.label||'No area';const here=pri&&pri.has(t.zoneId);const key=(here?'0':'1')+zl;(byZone[key]=byZone[key]||{label:zl+(here?' · overlaps this spot':''),items:[]}).items.push([id,t]);});
  const keys=Object.keys(byZone).sort();if(!keys.length)return `<div class="muted" style="font-size:12.5px">No other tasks yet.</div>`;
  Object.values(byZone).forEach(g=>g.items.sort((a,b)=>(SCH[a[0]]?.s??0)-(SCH[b[0]]?.s??0)||(isParent(a[0])?-1:1)));

function questionsFor(type){return Store.d.templates?.[type]?.questions||defaultQuestions(type);}

function openCreate(geo){
  const type=geo.type,T=TYPES[type],qs=questionsFor(type),def=templateDefaults(type);

  let body=`<div class="q"><label class="ql" for="c_label">Name on the plan</label><input class="inp" id="c_label" value="${esc(T.name+' '+count)}"><div class="help">${geo.geom==='poly'?'Area':'Length'}: ${size}${mPer()?'':' (set the scale to see metres)'}</div></div>`;
  qs.forEach(q=>{
    let f='';
    switch(q.kind){
      case 'vendor':f=vendorField('q_'+q.id,def.vendor);break;

      case 'parallel':f=vendorChecks('parallel',new Set(def.parallel||[]))+`<div class="help">Clash warnings are skipped for these vendors in this area.</div>`;break;
      case 'restrict':f=`<select class="sel" id="q_${q.id}" data-list="restrict">${restrictOptions(def.restrict??T.after??'none')}</select>`;break;
      case 'clear_by':f=`<input class="inp" type="date" id="q_${q.id}"><div class="help">Leave blank and the board sets it to the day the next vendor starts in this spot.</div>`;break;

      case 'power':f=`<label class="row" style="font-size:13px"><input type="checkbox" id="q_${q.id}" ${def.power?'checked':''}> Yes, let me draw the electrical cable route next</label>`;break;
      case 'yesno':f=`<select class="sel" id="q_${q.id}"><option value="">—</option><option ${def.answers?.[q.id]==='Yes'?'selected':''}>Yes</option><option ${def.answers?.[q.id]==='No'?'selected':''}>No</option></select>`;break;
      case 'number':f=`<input class="inp mono" type="number" id="q_${q.id}" value="${esc(def.answers?.[q.id]??'')}" style="width:120px">`;break;
      case 'choice':f=`<select class="sel" id="q_${q.id}" data-list="opt" data-type="${esc(type)}" data-qid="${esc(q.id)}"><option value="">—</option>${(q.options||[]).map(o=>`<option ${def.answers?.[q.id]===o?'selected':''}>${esc(o)}</option>`).join('')}${listTail('opt')}</select>`;break;

      follow.forEach((f,i)=>Store.put('tasks','t_'+uid(),{title:f.title,zoneId:zid,vendorId:f.vendorId,days:f.days,deps:[],status:'todo',notBefore:'',parentId:tid,order:i+1,withPrev:!!f.withPrev}));
    }else Store.put('tasks',tid,{title,zoneId:zid,vendorId,days,deps:before,status:'todo',notBefore});
    after.forEach(a=>{const t=clone(TK()[a]);t.deps=[...new Set([...(t.deps||[]),tid])];Store.put('tasks',a,t);});
  }

/* ============ question editor ============ */
function openQuestions(type,after){
  type=type||'turf';

/* step editing */
function addStep(id){
  const T=TK();const t=T[id];
  if(isParent(id)){const ks=KIDS[id];const last=T[ks[ks.length-1]];Store.put('tasks','t_'+uid(),{title:'New step',zoneId:t.zoneId,vendorId:'',days:1,deps:[],status:'todo',notBefore:'',parentId:id,order:(last?.order??ks.length-1)+1,withPrev:false});return;}
  // turn a single task into a job: its work becomes step 1
  Store.put('tasks','t_'+uid(),{title:t.title,zoneId:t.zoneId,vendorId:t.vendorId,days:t.days,deps:[],status:t.status||'todo',notBefore:'',parentId:id,order:0,withPrev:false});
  Store.put('tasks','t_'+uid(),{title:'Next step',zoneId:t.zoneId,vendorId:'',days:1,deps:[],status:'todo',notBefore:'',parentId:id,order:1,withPrev:false});
  const p=clone(t);p.title=Z()[t.zoneId]?.label?`${Z()[t.zoneId].label} works`:t.title;p.status='todo';Store.put('tasks',id,p);
}
function moveStep(id,dir){
  const pid=TK()[id].parentId;const ks=[...KIDS[pid]];const i=ks.indexOf(id),j=i+dir;if(j<0||j>=ks.length)return;
  [ks[i],ks[j]]=[ks[j],ks[i]];
  ks.forEach((k,n)=>{const t=TK()[k];if(t.order!==n||(n===0&&t.withPrev)){const c=clone(t);c.order=n;if(n===0)c.withPrev=false;Store.put('tasks',k,c);}});
}
function removeTask(id){
  const ids=new Set([id,...(KIDS[id]||[])]);const own=TK()[id].deps||[];
  Object.entries(TK()).forEach(([o,t])=>{if(ids.has(o))return;if((t.deps||[]).some(d=>ids.has(d))){const c=clone(t);c.deps=[...new Set(c.deps.filter(d=>!ids.has(d)).concat(TK()[id].parentId?[]:own))].filter(d=>d!==o);Store.put('tasks',o,c);}});
  const gone=clone(TK()[id]);const pid=gone.parentId;
  ids.forEach(k=>Store.del('tasks',k));
  // a job left with no steps becomes a plain task again, using the removed step's vendor and days
  if(pid&&TK()[pid]&&!Object.values(TK()).some(t=>t.parentId===pid)){const p=clone(TK()[pid]);p.vendorId=gone.vendorId;p.days=gone.days;Store.put('tasks',pid,p);}
}

function contactLine(vid){const v=V()[vid];if(!v)return '';const bits=[v.contact,v.phone,v.email].filter(Boolean);return `${v.name}${v.trade?` (${v.trade})`:''}${bits.length?': '+bits.join(' · '):''}`;}
function briefText(vid){
  const T=TK(),zs=Z();const mine=vendorSteps(vid);
  const L=[];L.push(`${S().name||'Event'} — brief for ${vendorName(vid)}`);L.push(`Build-up ${fmtDay(0,false)} → event ${fmtDay(eventOff(),false)}`);
  if(Store.mode==='github')L.push(`Live plan: ${vendorLink(vid)}`);
  const linked=new Set();
  L.push('');L.push('YOUR WORK');
  if(!mine.length)L.push('- No installation work assigned.');
  mine.forEach(i=>{const t=T[i];const z=zs[t.zoneId];
    const w=(EDEPS[i]||[]).map(d=>{const dv=isParent(d)?null:T[d].vendorId;if(dv&&dv!==vid)linked.add(dv);if(isParent(d))KIDS[d].forEach(k=>{if(T[k].vendorId!==vid)linked.add(T[k].vendorId);});return `${taskLabel(d)} (${isParent(d)?'all steps':vendorName(dv)})`;});
    const nxt=successors(i);nxt.forEach(o=>{if(T[o].vendorId!==vid)linked.add(T[o].vendorId);});
    const size=z&&mPer()&&!t.parentId?` (${z.geom==='poly'?fmtArea(Math.abs(polyArea(z.pts))):fmtLen(lengthOf(z))})`:'';
    L.push(`- ${taskLabel(i)} at ${z?.label||'site'}${size}: ${fmtDay(SCH[i].s)} → ${fmtDay(SCH[i].e)} (${t.days} day${t.days==1?'':'s'}).`);
    if(t.withPrev)L.push('    Runs at the same time as the step before it.');
    if(w.length)L.push(`    Start only after: ${w.join('; ')}.`);
    if(nxt.length)L.push(`    Finish on time: ${nxt.map(o=>`${vendorName(T[o].vendorId)} (${taskLabel(o)})`).join(', ')} starts right after you.`);});
  const drops=Object.keys(zs).filter(id=>TYPES[zs[id].type]?.drop&&zs[id].vendorId===vid);
  if(drops.length){L.push('');L.push('WHERE YOU CAN LEAVE ITEMS');drops.forEach(id=>{const c=clearByOff(id);L.push(`- ${zs[id].label}: ${c?`remove everything before ${fmtDay(c.off)}`:'no deadline yet'}${c&&c.task?` — ${taskLabel(c.task)} starts there`:''}.`);});L.push('- Do not leave items anywhere else.');}
  const rules=Object.keys(zs).filter(id=>zs[id].after&&zs[id].after!=='none');
  if(rules.length){L.push('');L.push('SITE RULES');rules.forEach(id=>L.push(`- ${zs[id].label}: ${restrictLabel(zs[id].after).toLowerCase()} from ${fmtDay(restrictFrom(id))}.`));}
  const locks=Object.keys(zs).map(id=>({id,w:zoneWindow(id)})).filter(x=>x.w&&zoneTasks(x.id).some(t=>T[t].vendorId!==vid));
  if(locks.length){L.push('');L.push('LOCKED WHILE OTHERS WORK (stay out)');locks.sort((a,b)=>a.w.s-b.w.s).forEach(({id})=>{const parts=zoneTasks(id).filter(t=>T[t].vendorId!==vid);const s=Math.min(...parts.map(t=>SCH[t].s)),e=Math.max(...parts.map(t=>SCH[t].e));const others=[...new Set(parts.map(t=>vendorName(T[t].vendorId)))];L.push(`- ${zs[id].label}: ${fmtDay(s)} → ${fmtDay(e)} (${others.join(', ')}).`);});}
  linked.delete(vid);linked.delete('');linked.delete(undefined);
  if(linked.size){L.push('');L.push('VENDORS BEFORE AND AFTER YOU');[...linked].forEach(o=>L.push('- '+contactLine(o)));}
  return L.join('\n');
}

function confirmBtn(b,fn){if(b.dataset.armed){fn();return;}b.dataset.armed='1';const t=b.textContent;b.textContent='Click again to confirm';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t;}},3000);}
function focusZone(zid){const z=Z()[zid];if(!z)return;const b=bbox(z);const cx=b.x+b.w/2,cy=b.y+b.h/2;const w=Math.max(ui.vb.w*0.6,b.w*2.2,300);const k=w/ui.vb.w;ui.vb={x:cx-w/2,y:cy-ui.vb.h*k/2,w,h:ui.vb.h*k};}
function openDeps(id){
  const t=TK()[id];
  // can't wait for itself, its own steps, its own job, or anything that already waits for it
  const desc=new Set([id,...(KIDS[id]||[])]);if(t.parentId)desc.add(t.parentId);
  let grew=true;while(grew){grew=false;Object.entries(TK()).forEach(([o,x])=>{if(!desc.has(o)&&((x.deps||[]).some(d=>desc.has(d))||desc.has(x.parentId))){desc.add(o);grew=true;}});}
  const here=new Set(Object.keys(Z()).filter(zid=>overlap(Z()[t.zoneId],Z()[zid])));
  openModal(`<div class="mh"><h2>${esc(taskLabel(id))} starts after…</h2><p>Tick everything that must be finished first. Pick a whole job to wait for all of its steps.</p></div><div class="mb">${taskChecks('dep',new Set(t.deps||[]),desc,here)}</div><div class="mf"><span></span><div class="row"><button class="btn" id="dc" type="button">Cancel</button><button class="btn primary" id="ds" type="button">Save</button></div></div>`,()=>{

}

/* ============ your own lists: item types, restrictions, statuses ============
   Everything here is stored in the plan, so it can be added to and edited from any dropdown. */
const DEFAULT_RESTRICTIONS=[
  {id:'no_vehicles',label:'No vehicles',short:'NO VEHICLES',blocksVehicles:true},
  {id:'no_walking',label:'Keep off: no foot traffic',short:'KEEP OFF',blocksVehicles:true},
  {id:'no_items',label:'Keep clear: no items',short:'KEEP CLEAR',blocksVehicles:false},
  {id:'closed',label:'Closed to everyone',short:'CLOSED',blocksVehicles:true}];
const DEFAULT_STATUSES=[
  {id:'todo',label:'Not started',base:'todo',core:true},
  {id:'started',label:'In progress',base:'started',core:true},
  {id:'done',label:'Done',base:'done',core:true}];
const BASE_LABEL={todo:'Not started',started:'In progress',done:'Done'};
// how each kind of item is drawn; your own item types pick one of these looks
const LOOKS={
  area:{geom:'poly',label:'Plain area in the vendor’s colour'},
  turf:{geom:'poly',label:'Grass pattern (turf)'},
  dropoff:{geom:'poly',label:'Drop-off / storage (items allowed until a date)'},
  nogo:{geom:'poly',label:'No-go zone (hazard stripes, no work)'},
  wall:{geom:'line',label:'Thick solid line (wall)'},
  fence_high:{geom:'line',label:'Line with posts (high fence)'},
  fence_low:{geom:'line',label:'Dotted line (low fence)'},
  cable:{geom:'line',label:'Orange dashed line (cables)'},
  route:{geom:'line',label:'Wide grey band (vehicle route)'}};
const BASE_LOOK={structure:'area',stage:'area',furniture:'area',area:'area',turf:'turf',dropoff:'dropoff',nogo:'nogo',wall:'wall',fence_high:'fence_high',fence_low:'fence_low',cable:'cable',route:'route'};
function restrictions(){return (Store.d.lists&&Store.d.lists.restrictions)||DEFAULT_RESTRICTIONS;}
function restrictLabel(id){if(!id||id==='none')return 'No restriction';return restrictions().find(r=>r.id===id)?.label||'Restricted';}
function restrictShort(id){const r=restrictions().find(x=>x.id===id);return r?(r.short||r.label).toUpperCase():'';}
function blocksVehicles(id){return !!restrictions().find(r=>r.id===id)?.blocksVehicles;}
function statuses(){return (Store.d.lists&&Store.d.lists.statuses)||DEFAULT_STATUSES;}
function statusBase(id){return statuses().find(s=>s.id===id)?.base||(BASE_LABEL[id]?id:'todo');}
function statusLabel(id){return statuses().find(s=>s.id===id)?.label||BASE_LABEL[statusBase(id)];}
const canManage=()=>Store.canEdit&&!!Store.eventId;
function listTail(kind){
  if(!canManage())return '';
  const add={restrict:'+ Add restriction…',status:'+ Add status…',type:'+ Add item type…',vendor:'+ Add vendor…',event:'+ New event…',opt:'+ Add option…'}[kind];
  const edit={restrict:'✎ Edit restrictions…',status:'✎ Edit statuses…',type:'✎ Edit item types…',vendor:'✎ Edit vendors…',event:'✎ Edit this event…',opt:'✎ Edit options…'}[kind];
  return `<option disabled>──────────</option>${add?`<option value="__add">${add}</option>`:''}<option value="__edit">${edit}</option>`;
}
function restrictOptions(sel){sel=sel||'none';return `<option value="none" ${sel==='none'?'selected':''}>No restriction</option>`+restrictions().map(r=>`<option value="${esc(r.id)}" ${r.id===sel?'selected':''}>${esc(r.label)}</option>`).join('')+(sel!=='none'&&!restrictions().some(r=>r.id===sel)?`<option value="${esc(sel)}" selected>(removed restriction)</option>`:'')+listTail('restrict');}
function statusOptions(sel){sel=sel||'todo';const list=statuses();return list.map(s=>`<option value="${esc(s.id)}" ${s.id===sel?'selected':''}>${esc(s.label)}</option>`).join('')+(!list.some(s=>s.id===sel)?`<option value="${esc(sel)}" selected>${esc(statusLabel(sel))}</option>`:'')+listTail('status');}
function typeOptions(sel){return Object.entries(TYPES).map(([k,t])=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(t.name)}${t.hidden?' (hidden)':''}</option>`).join('')+listTail('type');}
function rebuildTypes(){
  Object.keys(TYPES).forEach(k=>delete TYPES[k]);
  const ov=(Store.d&&Store.d.types)||{};
  Object.entries(BASE_TYPES).forEach(([k,t])=>{const o=ov[k]||{};const T={...t,look:BASE_LOOK[k],builtin:true};['name','task','days','after','hidden'].forEach(f=>{if(o[f]!==undefined&&o[f]!=='')T[f]=o[f];});TYPES[k]=T;});
  Object.entries(ov).forEach(([k,o])=>{
    if(!o||!o.custom||BASE_TYPES[k])return;
    const look=LOOKS[o.look]?o.look:'area';
    TYPES[k]={name:o.name||'New item',geom:LOOKS[look].geom,look,task:o.task||'Install',days:Number(o.days)||1,after:o.after||'none',hidden:!!o.hidden,custom:true,
      drop:look==='dropoff',route:look==='route',noTask:look==='route'||look==='nogo'||!!o.noTask};
  });
  TYPE_GROUPS.length=0;
  const vis=g=>Object.keys(TYPES).filter(k=>TYPES[k].geom===g&&!TYPES[k].hidden);
  TYPE_GROUPS.push(['Areas · click each corner',vis('poly')],['Lines · click each point',vis('line')]);
}
const lookOf=type=>TYPES[type]?.look||'area';
function usageOfType(k){return Object.values(Z()).filter(z=>z.type===k).length;}

/* ----- a dialog to add one entry ----- */
function openAddItem({title,intro,fields,onSave}){
  openModal(`<div class="mh"><h2>${esc(title)}</h2>${intro?`<p>${esc(intro)}</p>`:''}</div>

function fieldHtml(id,f,val){
  if(f.type==='check')return `<label class="row" style="font-size:13px"><input type="checkbox" id="${id}" ${val?'checked':''}> ${esc(f.label)}</label>`;
  if(f.type==='select')return `<div class="field"><label for="${id}">${esc(f.label)}</label><select class="sel" id="${id}">${f.options.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>${f.help?`<span class="muted" style="font-size:12px">${esc(f.help)}</span>`:''}</div>`;
  return `<div class="field"><label for="${id}">${esc(f.label)}</label><input class="inp" id="${id}" type="${f.type==='number'?'number':'text'}" ${f.type==='number'?'min="0.5" step="0.5"':''} value="${esc(val??'')}" placeholder="${esc(f.placeholder||'')}">${f.help?`<span class="muted" style="font-size:12px">${esc(f.help)}</span>`:''}</div>`;
}

/* ----- a dialog to edit a whole list: rename, reorder, add, remove ----- */
function openListEditor({title,intro,items,columns,newItem,locked,inUse,onSave}){
  let rows=clone(items);const removed=[];
  const draw=m=>{
    m.querySelector('#le_rows').innerHTML=rows.map((r,i)=>{
      const lock=locked&&locked(r);const used=inUse?inUse(r):0;
      return `<div class="qed" data-i="${i}"><div style="display:flex;flex-direction:column;gap:2px"><button class="btn small ghost" data-up="${i}" type="button" aria-label="Move up" ${i?'':'disabled'}>▲</button><button class="btn small ghost" data-dn="${i}" type="button" aria-label="Move down" ${i<rows.length-1?'':'disabled'}>▼</button></div>
      <div class="field" style="gap:5px">${columns.map(c=>{const id=`le_${i}_${c.key}`;const v=r[c.key];
        if(c.type==='check')return `<label class="row muted" style="font-size:12.5px"><input type="checkbox" id="${id}" data-k="${c.key}" ${v?'checked':''} ${c.lockable&&lock?'disabled':''}> ${esc(c.label)}</label>`;
        if(c.type==='color')return `<label class="row muted" style="font-size:12.5px"><input type="color" id="${id}" data-k="${c.key}" value="${esc(v||'#868e96')}" style="width:28px;height:24px;border:none;background:none;padding:0"> ${esc(c.label)}</label>`;
        if(c.type==='select')return `<label class="row muted" style="font-size:12.5px;flex-wrap:nowrap">${esc(c.label)} <select class="sel" id="${id}" data-k="${c.key}" ${c.lockable&&lock?'disabled':''} style="flex:1;min-width:0">${c.options.map(([ov,ol])=>`<option value="${esc(ov)}" ${ov===v?'selected':''}>${esc(ol)}</option>`).join('')}</select></label>`;
        return `<input class="inp" id="${id}" data-k="${c.key}" value="${esc(v??'')}" placeholder="${esc(c.label)}" aria-label="${esc(c.label)}" ${c.mono?'style="font-family:var(--f-mono);font-size:12.5px"':''}>`;}).join('')}
        ${used?`<span class="muted" style="font-size:11.5px">Used by ${used} item${used===1?'':'s'}</span>`:''}</div>
      ${lock?`<span class="muted" style="font-size:11px" title="Built in: you can rename it but not remove it">built in</span>`:`<button class="btn small ghost danger" data-rm="${i}" type="button" aria-label="Remove">✕</button>`}</div>`;}).join('')||'<div class="muted">The list is empty. Add an entry below.</div>';
  };
  const sync=m=>{m.querySelectorAll('#le_rows [data-k]').forEach(el=>{const i=+el.closest('[data-i]').dataset.i;rows[i][el.dataset.k]=el.type==='checkbox'?el.checked:el.value;});};
  openModal(`<div class="mh"><h2>${esc(title)}</h2>${intro?`<p>${esc(intro)}</p>`:''}</div>
  <div class="mb"><div id="le_rows" style="display:flex;flex-direction:column;gap:6px"></div><button class="btn small" id="le_add" type="button" style="align-self:flex-start">+ Add</button></div>
  <div class="mf"><span></span><div class="row"><button class="btn" id="le_c" type="button">Cancel</button><button class="btn primary" id="le_s" type="button">Save list</button></div></div>`,m=>{
    draw(m);
    m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!m.querySelector('#le_rows').contains(b))return;sync(m);
      if(b.dataset.up){const i=+b.dataset.up;[rows[i-1],rows[i]]=[rows[i],rows[i-1]];draw(m);}
      else if(b.dataset.dn){const i=+b.dataset.dn;[rows[i+1],rows[i]]=[rows[i],rows[i+1]];draw(m);}
      else if(b.dataset.rm){const i=+b.dataset.rm;const used=inUse?inUse(rows[i]):0;
        if(used&&!b.dataset.armed){b.dataset.armed='1';b.textContent='Remove?';b.title=`Used by ${used} item${used===1?'':'s'}. Click again to remove.`;return;}
        removed.push(rows[i]);rows.splice(i,1);draw(m);}});
    m.querySelector('#le_add').onclick=()=>{sync(m);rows.push(newItem());draw(m);const ins=m.querySelectorAll('#le_rows input.inp');const last=ins[ins.length-1];last&&last.focus();};
    m.querySelector('#le_c').onclick=closeModal;
    m.querySelector('#le_s').onclick=()=>{sync(m);const first=columns.find(c=>!c.type||c.type==='text');if(first&&rows.some(r=>!String(r[first.key]||'').trim())){toast(`Every entry needs a ${first.label.toLowerCase()}.`);return;}closeModal();onSave(rows,removed);};
  });
}

    ${fieldHtml('te_name',{label:'Name',placeholder:'e.g. Tent, Barrier, Signage, Toilets'},T.name)}

    ${fieldHtml('te_hidden',{type:'check',label:'Hide from the toolbar'},T.hidden)}
  </form>
  <div class="mf">${!isNew&&!T.builtin&&!used?'<button class="btn ghost danger" id="te_del" type="button">Delete type</button>':'<span></span>'}<div class="row"><button class="btn" id="te_c" type="button">Cancel</button><button class="btn primary" id="te_s" type="button">${isNew?'Add item type':'Save'}</button></div></div>`,m=>{

    m.querySelector('#te_s').onclick=()=>{

      else{if(isNew)k='c_'+slugify(name).slice(0,20)+'_'+uid().slice(0,4);Store.d.types={...Store.d.types,[k]:{...(Store.d.types[k]||{}),...o,custom:true,look:m.querySelector('#te_look').value}};}
      closeModal();rebuildTypes();Store.touch();refreshLists('type');toast(isNew?`Added “${name}”. It’s in the toolbar.`:'Saved.');onDone&&onDone(k);

/* ----- what "+ Add…" and "✎ Edit…" do for each list ----- */

      onSave(rows,removed){const gone=new Map(removed.map(s=>[s.id,s.base]));Store.d.lists={...Store.d.lists,statuses:rows.map(s=>({...s,label:s.label.trim()}))};
        if(gone.size)Object.entries(TK()).forEach(([id,t])=>{if(gone.has(t.status))Store.d.tasks[id]={...t,status:gone.get(t.status)||'todo'};});Store.touch();refreshLists('status');}});}

// rebuild one dropdown's options from its list, keeping its value
function rebuildSelect(s,keep){
  const kind=s.dataset.list,v=keep??s.value;
  if(kind==='restrict')s.innerHTML=restrictOptions(v);
  else if(kind==='status')s.innerHTML=statusOptions(v);
  else if(kind==='type')s.innerHTML=typeOptions(v);
  else if(kind==='vendor'){if(s.id==='viewAs')return;s.innerHTML=vendorOptions(v);}
  else if(kind==='opt'){const q=questionsFor(s.dataset.type).find(x=>x.id===s.dataset.qid);s.innerHTML=`<option value="">—</option>${(q?.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}${listTail('opt')}`;}
  else return;
  s.value=v;
}
// after a list changed: rebuild dropdowns inside open dialogs (the side panel re-renders on its own)
function refreshLists(kind){document.querySelectorAll(`#modalRoot select[data-list="${kind}"]`).forEach(s=>rebuildSelect(s));changed();}
// catch "+ Add…" / "✎ Edit…" in any dropdown before its normal change handler runs
document.addEventListener('change',e=>{
  const s=e.target;if(!(s instanceof HTMLSelectElement)||!s.dataset.list)return;
  const v=s.value;if(v!=='__add'&&v!=='__edit')return;
  e.stopImmediatePropagation();e.stopPropagation();
  const prev=s.dataset.prev??([...s.options].find(o=>o.defaultSelected&&!o.value.startsWith('__'))||s.options[0]).value;
  s.value=prev;
  const L=LISTS[s.dataset.list];if(!L)return;
  if(v==='__add')L.add(id=>{
      if(!s.isConnected||id==null)return;
      rebuildSelect(s,prev);
      // pick the new entry and let the dropdown's own handler save it
      if([...s.options].some(o=>o.value===id)){s.value=id;s.dataset.prev=id;s.dispatchEvent(new Event('change',{bubbles:true}));}
    },s);
  else L.edit(s);
},true);
document.addEventListener('focusin',e=>{const s=e.target;if(s instanceof HTMLSelectElement&&s.dataset.list&&!s.value.startsWith('__'))s.dataset.prev=s.value;});

function openListsHub(){
  openModal(`<div class="mh"><h2>Lists</h2><p>The options in the board’s dropdowns. You can also add or edit from the bottom of any dropdown.</p></div>
  <div class="mb" style="gap:8px">
    <button class="btn" data-hub="types" type="button" style="justify-content:space-between"><span>Item types</span><span class="muted">${Object.keys(TYPES).length}</span></button>
    <button class="btn" data-hub="restrict" type="button" style="justify-content:space-between"><span>Restrictions after install</span><span class="muted">${restrictions().length}</span></button>
    <button class="btn" data-hub="status" type="button" style="justify-content:space-between"><span>Task statuses</span><span class="muted">${statuses().length}</span></button>
    <button class="btn" data-hub="vendor" type="button" style="justify-content:space-between"><span>Vendors</span><span class="muted">${Object.keys(V()).length}</span></button>
    <button class="btn" data-hub="questions" type="button" style="justify-content:space-between"><span>Questions and their options</span><span class="muted">per item type</span></button>
  </div><div class="mf"><span></span><button class="btn" id="lh_c" type="button">Done</button></div>`,m=>{
    m.querySelector('#lh_c').onclick=closeModal;
    m.addEventListener('click',e=>{const b=e.target.closest('[data-hub]');if(!b)return;const k=b.dataset.hub;
      if(k==='types')openTypeManager();else if(k==='questions')openQuestions();else LISTS[k].edit();});
  });
}

/* ============ view as ============ */
function setViewAs(v){ui.viewAs=v;ls.set('siteboard.viewAs',v);ui.tool='select';ui.draft=null;ui.tab=v==='planner'?'schedule':'brief';renderAll();}
$('#viewAs').onchange=e=>setViewAs(e.target.value);

/* ============ top-level render ============ */
function renderHeader(){
  const s=S();$('#planName').textContent=s.name||'Untitled event';document.title=(s.name?s.name+' · ':'')+'Build-Up Site Board';
  $('#dates').textContent=s.setupStart?`Build-up ${fmtDay(0,false)} · Event ${fmtDay(eventOff(),false)}`:'Build-up board';
  const lv=Store.lockedVendor&&!Store.canEdit?Store.lockedVendor:null;
  if(lv&&V()[lv])ui.viewAs=lv;
  if(ui.viewAs!=='planner'&&!V()[ui.viewAs]&&Store.mode!=='loading')ui.viewAs='planner';
  const vs=Object.entries(V()).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const sel=$('#viewAs');
  sel.innerHTML=(lv?'':`<option value="planner">${Store.canEdit?'Planner (everything)':'Everyone'}</option>`)+vs.filter(([id])=>!lv||id===lv).map(([id,v])=>`<option value="${id}">${esc(v.name)}</option>`).join('')+(lv?'':listTail('vendor'));
  sel.value=ui.viewAs;sel.disabled=!!lv;
  $('#btnLogin').hidden=!(Store.mode==='github'&&!Store.canEdit&&!Store.lockedVendor);
  // event switcher: hidden on vendor links, so a vendor stays on their own event
  const es=$('#eventSel');const evs=[...Store.events].sort((a,b)=>(a.setupStart||'').localeCompare(b.setupStart||'')||a.name.localeCompare(b.name));
  const showPick=!Store.lockedVendor&&Store.mode!=='loading'&&(evs.length>0||Store.canEdit);
  $('#evPick').hidden=!showPick;
  es.hidden=!evs.length;
  es.innerHTML=evs.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}${e.setupStart?' · '+esc(e.setupStart.slice(5).split('-').reverse().join('/')):''}</option>`).join('')+(Store.eventId&&!evs.some(e=>e.id===Store.eventId)?`<option value="${esc(Store.eventId)}">${esc(S().name||'This event')}</option>`:'')+(Store.canEdit?`<option disabled>──────────</option><option value="__add">+ New event…</option>`+(Store.eventId?`<option value="__edit">✎ Edit this event…</option>`:''):'');
  if(Store.eventId)es.value=Store.eventId;
  $('#btnNewEvent').hidden=!Store.canEdit;
  $('#btnSettings').hidden=!Store.eventId;
  setSave();
}
$('#eventSel').addEventListener('change',async e=>{const id=e.target.value;e.target.disabled=true;try{await Store.switchEvent(id);}finally{e.target.disabled=false;renderHeader();}});
$('#btnNewEvent').onclick=()=>openNewEvent();
function openNewEvent(){
  const has=!!Store.eventId;const cur=S();
  const nVend=Object.keys(V()).length,nZones=Object.keys(Z()).length;
  openModal(`<div class="mh"><h2>New event</h2><p>Each event has its own plan, floor plan, schedule and vendor links.</p></div>
  <form class="mb" id="nef">
    <div class="field"><label for="ne_name">Event name</label><input class="inp" id="ne_name" required placeholder="e.g. Winter Market 2026"></div>
    <div class="row"><div class="field" style="flex:1"><label for="ne_s">First build-up day</label><input class="inp" type="date" id="ne_s" value="${isoOf0(7)}"></div><div class="field" style="flex:1"><label for="ne_e">Event day</label><input class="inp" type="date" id="ne_e" value="${isoOf0(14)}"></div></div>
    <div class="field"><label>Start from</label>
      <label class="choice"><input type="radio" name="ne_from" value="blank" checked><span><b>Empty plan</b><br><span class="muted" style="font-size:12.5px">Nothing on it. Add vendors and draw from scratch.</span></span></label>
      ${has?`<label class="choice"><input type="radio" name="ne_from" value="team"><span><b>Same vendors and questions</b><br><span class="muted" style="font-size:12.5px">Copies the ${nVend} vendor${nVend===1?'':'s'} and your saved questions from “${esc(cur.name||'this event')}”. The map starts empty.</span></span></label>
      <label class="choice"><input type="radio" name="ne_from" value="copy"><span><b>Copy of “${esc(cur.name||'this event')}”</b><br><span class="muted" style="font-size:12.5px">Everything: ${nZones} area${nZones===1?'':'s'} and lines, jobs, vendors, floor plan. Dates move with the new build-up day and every task is set back to not started.</span></span></label>`:''}
    </div>
  </form>
  <div class="mf"><span></span><div class="row"><button class="btn" id="ne_c" type="button">Cancel</button><button class="btn primary" id="ne_go" type="button">Create event</button></div></div>`,()=>{
    const go=async()=>{
      const name=$('#ne_name').value.trim();if(!name){toast('Give the event a name.');$('#ne_name').focus();return;}
      const setupStart=$('#ne_s').value,eventDate=$('#ne_e').value;
      if(setupStart&&eventDate&&eventDate<setupStart){toast('The event day is before the first build-up day.');return;}
      const from=(document.querySelector('input[name=ne_from]:checked')||{}).value||'blank';
      const b=$('#ne_go');b.disabled=true;b.textContent='Creating…';
      try{await Store.createEvent({name,setupStart,eventDate,from});closeModal();toast(`Created “${name}”.`);}
      catch(e){b.disabled=false;b.textContent='Create event';toast('Could not create the event: '+e.message);}
    };
    $('#ne_c').onclick=closeModal;$('#ne_go').onclick=go;$('#nef').addEventListener('submit',e=>{e.preventDefault();go();});
  });
}
function renderScrub(){
  const max=Math.max(eventOff(),1);const r=$('#day');r.max=max;if(ui.day>max)ui.day=max;r.value=ui.day;
  $('#dayLabel').innerHTML=`<small>${ui.day>=eventOff()?'Event day':'Build-up day '+(Math.floor(ui.day)+1)}</small>${fmtDay(ui.day)}`;
  const n=Math.min(max,10);$('#ticks').innerHTML=Array.from({length:n+1},(_,i)=>`<span>${shortDay(Math.round(i*max/n))}</span>`).join('');
}
$('#day').addEventListener('input',e=>{ui.day=parseFloat(e.target.value);renderScrub();renderMap();if(ui.tab==='schedule')renderPanel();});
function renderEmpty(){
  const em=$('#empty'),bn=$('#banner');
  if(Store.mode==='loading'){em.hidden=false;em.innerHTML=`<div class="box"><h2>Loading the plan…</h2></div>`;bn.hidden=true;return;}
  const localWeb=Store.mode==='local'&&location.protocol!=='file:';
  bn.hidden=!(localWeb||Store.problem);
  if(Store.problem)bn.textContent=Store.problem;
  else if(localWeb)bn.textContent='No GitHub repository set, so this plan is saved in this browser only. Fill in owner and repo at the top of index.html, or open it from your github.io address.';
  if(!Store.eventId){
    em.hidden=false;
    em.innerHTML=Store.canEdit?`<div class="box"><h2>No events yet</h2><p class="muted">Create your first event. Each event gets its own plan, floor plan and vendor links.</p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="eNew" type="button">+ New event</button></div></div>`:`<div class="box"><h2>No events yet</h2><p class="muted">${Store.mode==='github'?'Planners: use Planner sign-in at the top to create one.':'Nothing has been planned yet.'}</p></div>`;
    const n=$('#eNew');if(n)n.onclick=()=>openNewEvent();
    return;
  }
  if(!Object.keys(Z()).length&&!isDrawing()){
    em.hidden=false;
    em.innerHTML=Store.canEdit?`<div class="box"><h2>Start your site plan</h2><p class="muted">Upload your floor plan in Event settings, set the scale, then pick an item on the left and click each corner. The board asks who installs it, how long it takes and who goes before and after.</p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="eSettings" type="button">Event settings</button><button class="btn" id="eSample" type="button">Load example event</button></div></div>`:`<div class="box"><h2>No plan yet</h2><p class="muted">The planner hasn’t drawn anything yet. This page updates on its own.</p></div>`;
    const a=$('#eSettings');if(a)a.onclick=openSettings;
    const b=$('#eSample');if(b)b.onclick=()=>{Store.replaceAll(makeSample());fit();};
  }else em.hidden=true;
}
let raf=0,dataStamp=0,schedStamp=-1;
function changed(){dataStamp++;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderAll();});}
// recalculate dates and clashes whenever the plan has changed since the last calculation
function ensureSchedule(){if(schedStamp===dataStamp)return;schedStamp=dataStamp;rebuildTypes();computeSchedule();CONF=conflicts();}
function renderAll(){
  ensureSchedule();
  renderHeader();renderRail();renderScrub();renderMap();
  const ae=document.activeElement;
  if(!ae||!$('#pbody').contains(ae)||ae.tagName==='BUTTON')renderPanel();else renderTabs();
  renderEmpty();
}
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(fit,150);});
window.addEventListener('beforeunload',e=>{if(Store.mode==='github'&&(Store.dirty||Store.saving)){Store.flush();e.preventDefault();e.returnValue='';}});
renderAll();fit();
Store.init().then(()=>{dataStamp++;if(Store.lockedVendor&&!Store.canEdit){ui.viewAs=Store.lockedVendor;ui.tab='brief';}renderAll();fit();});
window.SiteBoard={Store,ui,snapPoint,overlap,straighten,polyArea};
})();
</script>
